/* 5.1 出题引擎 ------------------------------------------------------- */
function quizSourceWords(level, scope){
  return WORDS.filter(function(w){
    if (level && level !== "all" && w.level !== level) return false;
    const s = ST.wordStats[w.id];
    if (scope === "learned" && (!s || s.status === "new")) return false;
    if (scope === "wrong" && !(s && s.wrongCount > 0)) return false;
    if (scope === "high" && w.frequency < 4) return false;
    return true;
  });
}
/* 生成干扰项：优先同等级、同词性 */
function distractors(word, pool, n){
  const sameLevel = pool.filter(function(w){ return w.id !== word.id && w.level === word.level; });
  const samePos = sameLevel.filter(function(w){ return w.pos === word.pos; });
  const out = [];
  function takeFrom(arr){
    const shuffled = shuffle(arr);
    for (let i = 0; i < shuffled.length && out.length < n; i++){
      if (out.indexOf(shuffled[i]) < 0) out.push(shuffled[i]);
    }
  }
  takeFrom(samePos);
  takeFrom(sameLevel);
  takeFrom(pool.filter(function(w){ return w.id !== word.id; }));
  return out.slice(0, n);
}
function buildQuestion(type, word, pool){
  const s = wsOf(word.id);
  if (type === "en2cn"){
    const opts = shuffle([word].concat(distractors(word, pool, 3)));
    return {
      type:"en2cn", wordId:word.id, word:word.word,
      prompt:'单词 <b style="font-size:17px">' + esc(word.word) + '</b> <span class="phonetic">' + esc(word.phonetic) + '</span> 的意思是？',
      options:opts.map(function(o){ return { text:o.meaningCn + "（" + o.pos + "）", correct:o.id === word.id }; }),
      answerText:word.meaningCn, speak:word.word,
      analysis:"<span class='k'>词性释义：</span>" + esc(word.pos) + " " + esc(word.meaningCn) + "<br><span class='k'>英文释义：</span>" + esc(word.meaningEn) + "<br><span class='k'>例句：</span>" + esc(word.example) + "（" + esc(word.exampleCn) + "）"
    };
  }
  if (type === "cn2en"){
    const opts = shuffle([word].concat(distractors(word, pool, 3)));
    return {
      type:"cn2en", wordId:word.id, word:word.word,
      prompt:'中文释义「<b>' + esc(word.meaningCn) + '</b>」（' + esc(word.pos) + '）对应的英文单词是？',
      options:opts.map(function(o){ return { text:o.word + "  " + o.phonetic, correct:o.id === word.id }; }),
      answerText:word.word, speak:word.word,
      analysis:"<span class='k'>正确单词：</span>" + esc(word.word) + " " + esc(word.phonetic) + "<br><span class='k'>例句：</span>" + esc(word.example) + "（" + esc(word.exampleCn) + "）"
    };
  }
  if (type === "spell" || type === "sentence"){
    const mask = maskWord(word.word, type === "spell" ? 0.55 : 0.7);
    if (type === "spell"){
      return {
        type:"spell", wordId:word.id, word:word.word, input:true,
        prompt:"根据中文释义拼写完整单词：<b>" + esc(word.meaningCn) + "</b>（" + esc(word.pos) + "）",
        code:mask.code,
        answers:[word.word.toLowerCase()], answerText:word.word, speak:word.word,
        analysis:"<span class='k'>拼写：</span>" + esc(word.word) + " " + esc(word.phonetic) + "<br><span class='k'>释义：</span>" + esc(word.meaningCn) + "<br><span class='k'>例句：</span>" + esc(word.example) + "（" + esc(word.exampleCn) + "）"
      };
    }
    return {
      type:"sentence", wordId:word.id, word:word.word, input:true,
      prompt:"补全例句中缺失的单词（" + esc(word.meaningCn) + "）：",
      code:"",
      sentence:esc(word.example).replace(new RegExp("\\b" + word.word + "\\w*", "i"), '<span class="tag hot">______</span>'),
      answers:[word.word.toLowerCase()], answerText:word.word, speak:word.word,
      analysis:"<span class='k'>原句：</span>" + esc(word.example) + "（" + esc(word.exampleCn) + "）<br><span class='k'>释义：</span>" + esc(word.pos) + " " + esc(word.meaningCn)
    };
  }
  if (type === "audio"){
    const opts = shuffle([word].concat(distractors(word, pool, 3)));
    return {
      type:"audio", wordId:word.id, word:word.word,
      prompt:"🔊 点击播放，选出你听到的单词：",
      options:opts.map(function(o){ return { text:o.word, correct:o.id === word.id }; }),
      answerText:word.word, speak:word.word, autoSpeak:true,
      analysis:"<span class='k'>听到的单词：</span>" + esc(word.word) + " " + esc(word.phonetic) + "（" + esc(word.meaningCn) + "）<br><span class='k'>例句：</span>" + esc(word.example)
    };
  }
  // 兜底：英译中
  return buildQuestion("en2cn", word, pool);
}
/* 生成遮蔽式拼写提示：保留首字母与约 40% 字母 */
function maskWord(word, hideRatio){
  const letters = word.split("");
  const hideCount = Math.max(1, Math.round(letters.length * hideRatio));
  const hideIdx = sample(letters.map(function(_, i){ return i; }).filter(function(i){ return i > 0; }), hideCount);
  const code = letters.map(function(ch, i){ return hideIdx.indexOf(i) >= 0 ? "_" : ch; }).join(" ");
  return { code:code, hideIdx:hideIdx };
}
function buildQuiz(type, count, level, scope){
  const pool = quizSourceWords(level, scope);
  if (pool.length < 4) return null;
  /* 权重：错词与低熟悉度单词优先进入题库 */
  const weighted = [];
  pool.forEach(function(w){
    const st = wsOf(w.id);
    let weight = 1;
    if (st.wrongCount > 0) weight += 3;
    if (st.status === "new") weight += 1;
    if (st.familiarity <= 2) weight += 1;
    for (let i = 0; i < weight; i++) weighted.push(w);
  });
  const picked = [];
  const seen = {};
  let guard = 0;
  while (picked.length < count && guard < count * 40){
    guard++;
    const w = pick(weighted);
    if (seen[w.id]) continue;
    seen[w.id] = true;
    picked.push(w);
  }
  const types = (type && type !== "mixed") ? [type] : QUIZ_TYPES.map(function(t){ return t.id; });
  const questions = picked.map(function(w, i){
    const t = type && type !== "mixed" ? type : types[i % types.length];
    return buildQuestion(t, w, pool);
  });
  /* 避免相邻两题针对同一个单词 */
  for (let i = 1; i < questions.length; i++){
    if (questions[i].wordId === questions[i - 1].wordId && i + 1 < questions.length){
      const tmp = questions[i]; questions[i] = questions[i + 1]; questions[i + 1] = tmp;
    }
  }
  return questions;
}

/* 5.3 测验流程控制 --------------------------------------------------- */
function startQuiz(type, count, level, scope){
  const questions = buildQuiz(type, count, level, scope);
  if (!questions || !questions.length){
    toast("词库中符合条件的内容不足，无法生成测验", "err");
    return;
  }
  UI.quiz = {
    questions:questions, index:0, score:0, wrong:[], answers:[],
    startedAt:Date.now(), finished:false, answered:null,
    type:type, typeLabel:(type === "mixed" ? "混合题型" : (QUIZ_TYPES.find(function(t){ return t.id === type; }) || {}).label || type)
  };
  goPage("quiz");
  const q = UI.quiz;
  if (q && q.questions[0] && q.questions[0].autoSpeak) speak(q.questions[0].speak);
}
function currentQuizQuestion(){
  const q = UI.quiz;
  if (!q) return null;
  return q.questions[q.index];
}
function answerQuiz(selectedIndex, inputText){
  const q = UI.quiz;
  if (!q || q.answered) return;
  const item = q.questions[q.index];
  let correct = false, text = "";
  if (item.input){
    text = String(inputText || "").trim();
    if (!text){ toast("请先输入答案", "warn"); return; }
    correct = item.answers.some(function(a){ return a === text.toLowerCase(); });
  } else {
    correct = !!item.options[selectedIndex] && item.options[selectedIndex].correct;
    text = item.options[selectedIndex] ? item.options[selectedIndex].text : "";
  }
  q.answered = { correct:correct, selected:selectedIndex, text:text, isLast:(q.index === q.questions.length - 1) };
  if (correct) q.score++;
  recordQuizAnswer(correct);
  q.answers.push({ wordId:item.wordId, type:item.type, correct:correct, text:text });
  if (!correct){
    const rec = {
      id:uid(), wordId:item.wordId, word:item.word,
      type:item.type, prompt:item.prompt.replace(/<[^>]+>/g, ""),
      userAnswer:text, correct:item.answerText,
      analysis:item.analysis, time:Date.now()
    };
    q.wrong.push(rec);
    /* 合并进错题本：同一单词+同一题型仅保留最近一条 */
    ST.mistakes = ST.mistakes.filter(function(m){ return !(m.wordId === item.wordId && m.type === item.type); });
    ST.mistakes.unshift(rec);
    /* 错词的熟悉度下调，使其更快进入复习队列 */
    const s = wsOf(item.wordId);
    s.wrongCount = (s.wrongCount || 0) + 1;
    s.familiarity = Math.max(0, s.familiarity - 1);
    s.nextReview = Date.now() + HOUR_MS;
    if (s.status === "new") s.status = "learning";
    if (!s.firstLearned) s.firstLearned = todayStr();
    saveState();
  }
  render();
}
function nextQuestion(){
  const q = UI.quiz;
  if (!q) return;
  if (!q.answered){ toast("请先作答", "warn"); return; }
  q.answered = null;
  if (q.index >= q.questions.length - 1){
    q.finished = true;
    flushDuration();
    render();
    return;
  }
  q.index++;
  render();
  const item = q.questions[q.index];
  if (item && item.autoSpeak) speak(item.speak);
}

      if (answered !== null && answered !== undefined){
        cls += " locked";
        if (i === item.answer) cls += " correct";
        else if (i === answered) cls += " wrong";
        else cls += " dim";

      return '<button class="' + cls + '" data-gopt="' + i + '"><span class="idx">' + "ABCD"[i] + '</span><span class="opt-text">' + esc(o) + '</span></button>';

  const correct = i === item.answer;
  if (correct) gq.score++;
  recordQuizAnswer(correct);
  /* 语法练习的错题也计入错题本（以语法题形式，便于复习） */

      id:uid(), wordId:"grammar:" + item.id, word:item.id, type:"grammar",

      analysis:item.analysis, time:Date.now()
    };
    ST.mistakes = ST.mistakes.filter(function(m){ return m.wordId !== rec.wordId; });
    ST.mistakes.unshift(rec);
    saveState();
  }
  render();

function estimateFinishDays(){

  const per = Math.max(1, ST.settings.dailyNew);

}

  map.forEach(function(cfg){

    if (!input) return;
    input.addEventListener("input", function(){
      out.textContent = input.value + cfg[3];

    input.addEventListener("change", function(){
      ST.settings[cfg[1]] = parseInt(input.value, 10);

};

function buildExportObject(){
  return {
    app:"CET 四六级学习助手",
    version:DATA_VERSION,
    exportedAt:new Date().toISOString(),
    settings:ST.settings,
    wordStats:ST.wordStats,
    grammarStats:ST.grammarStats,
    records:ST.records,
    mistakes:ST.mistakes,
    customWords:ST.customWords || [],
    meta:ST.meta
  };
}
function downloadJSON(obj, filename){
  try{
    const text = JSON.stringify(obj, null, 2);
    const blob = new Blob([text], { type:"application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 500);
    toast("已开始下载：" + filename, "ok");
    return true;
  }catch(err){
    console.error("[CET] 导出失败", err);
    toast("导出失败：" + err.message, "err");
    return false;
  }
}
function importDataObject(obj){
  if (!obj || typeof obj !== "object"){
    toast("导入失败：JSON 内容不是对象", "err");
    return;
  }
  /* 情况一：自定义词库（只有 words 字段或数组） */
  if (Array.isArray(obj) || Array.isArray(obj.words)){
    const rows = Array.isArray(obj) ? obj : obj.words;
    importCustomWords(rows);
    return;
  }
  /* 情况二：完整学习数据 */
  if (!obj.wordStats && !obj.records && !obj.settings){
    toast("导入失败：未识别到学习数据或词库字段", "err");
    return;
  }
  confirmDialog("确认导入学习数据？",
    "导入将<b>覆盖</b>当前的学习进度、设置与错题本（错题与收藏会被替换）。建议先导出当前数据作为备份。",
    function(){
      ST = mergeState(obj);
      if (Array.isArray(obj.customWords) && obj.customWords.length) importCustomWords(obj.customWords, true);
      applyTheme(ST.settings.theme);
      saveState();
      render();
      toast("导入成功，学习数据已恢复", "ok");
    }, "确认导入");
}
function importCustomWords(rows, silent){
  if (!Array.isArray(rows) || !rows.length){ toast("未找到可导入的词条", "err"); return; }
  const existingWords = {};
  WORDS.forEach(function(w){ existingWords[w.word.toLowerCase()] = true; });
  let added = 0, skipped = 0;
  rows.forEach(function(r, i){
    if (!r || typeof r !== "object" || !r.word || !(r.meaningCn || r.meaning)){
      skipped++; return;
    }
    const word = String(r.word).trim();
    if (existingWords[word.toLowerCase()]){ skipped++; return; }
    const w = {
      id: r.id || ("custom-" + uid() + "-" + i),
      word: word,
      phonetic: r.phonetic || "/—/",
      pos: r.pos || "—",
      meaningCn: r.meaningCn || r.meaning || "",
      meaningEn: r.meaningEn || "",
      example: r.example || "",
      exampleCn: r.exampleCn || "",
      synonyms: r.synonyms || "",
      antonyms: r.antonyms || "",
      rootAffix: r.rootAffix || "",
      collocations: r.collocations || "",
      level: String(r.level || "4"),
      frequency: parseInt(r.frequency, 10) || 3,
      tags: Array.isArray(r.tags) ? r.tags.slice() : ["自定义"],
      status:"new", familiarity:0, nextReview:0, lastReview:0,
      correctCount:0, wrongCount:0, favorite:false, note:r.note || "",
      createdAt:Date.now(), firstLearned:"", custom:true
    };
    WORDS.push(w);
    WORD_MAP[w.id] = w;
    existingWords[word.toLowerCase()] = true;
    ST.customWords = ST.customWords || [];
    ST.customWords.push(w);
    added++;
  });
  saveState();
  if (!silent || added){
    toast("自定义词库导入完成：新增 " + added + " 条" + (skipped ? "，跳过 " + skipped + " 条（重复或字段缺失）" : ""), added ? "ok" : "warn");
  }
  if (currentPage === "words" || currentPage === "settings") render();
}

function onViewClick(e){
  const t = e.target;
  const navBtn = t.closest("[data-nav]");
  if (navBtn){ goPage(navBtn.getAttribute("data-nav")); return; }
  const speakBtn = t.closest("[data-speak]");
  if (speakBtn){
    const text = speakBtn.getAttribute("data-speak");
    if (text) speak(text);
    return;
  }
  const chipBtn = t.closest("[data-chip]");
  if (chipBtn){
    const kind = chipBtn.getAttribute("data-chip");
    const value = chipBtn.getAttribute("data-value");
    if (kind === "level") UI.wordFilter.level = value;
    if (kind === "scope") UI.wordFilter.scope = value;
    if (kind === "tag") UI.wordFilter.tag = value;
    UI.wordFilter.page = 1;
    UI.cardIndex = 0;
    render();
    return;
  }
  const pageBtn = t.closest("[data-page]");
  if (pageBtn){
    const dir = pageBtn.getAttribute("data-page");
    const list = filterWords();
    const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    let target = UI.wordFilter.page;
    if (dir === "next") target = UI.wordFilter.page + 1;
    else if (dir === "prev") target = UI.wordFilter.page - 1;
    else if (dir === "first") target = 1;
    else if (dir === "last") target = totalPages;
    else if (dir === "jump"){
      const input = byId("pageJump");
      const v = input ? parseInt(input.value, 10) : NaN;
      if (isNaN(v)){ toast("请输入有效页码", "warn"); return; }
      target = v;
    }
    UI.wordFilter.page = clamp(target, 1, totalPages);
    render();
    window.scrollTo({ top:0, behavior:"smooth" });
    return;
  }
  const cardBtn = t.closest("[data-card]");
  if (cardBtn){ handleCardAction(cardBtn.getAttribute("data-card")); return; }
  const fbBtn = t.closest("[data-fb]");
  if (fbBtn){ sessionFeedback(fbBtn.getAttribute("data-fb")); return; }
  const favBtn = t.closest("[data-fav]");
  if (favBtn){
    const id = favBtn.getAttribute("data-fav");
    const on = toggleFavoriteWord(id);
    toast(on ? "已收藏 ⭐" : "已取消收藏", on ? "ok" : "");
    render();
    return;
  }
  const masterBtn = t.closest("[data-master]");
  if (masterBtn){
    const id = masterBtn.getAttribute("data-master");
    const w = WORD_MAP[id];
    markMastered(id);
    recordNewOrReview(id);
    toast("🏆 已标记「" + (w ? w.word : id) + "」为已掌握，30 天后复习", "ok");
    checkInIfDone();
    render();
    return;
  }
  const knowBtn = t.closest("[data-know]");
  if (knowBtn){ quickFeedback(knowBtn.getAttribute("data-know"), "know"); return; }
  const fuzzyBtn = t.closest("[data-fuzzy]");
  if (fuzzyBtn){ quickFeedback(fuzzyBtn.getAttribute("data-fuzzy"), "fuzzy"); return; }
  const unknownBtn = t.closest("[data-unknown]");
  if (unknownBtn){ quickFeedback(unknownBtn.getAttribute("data-unknown"), "unknown"); return; }
  const detailBtn = t.closest("[data-detail]");
  if (detailBtn){ showWordDetail(detailBtn.getAttribute("data-detail")); return; }
  const optBtn = t.closest("[data-opt]");
  if (optBtn){ answerQuiz(parseInt(optBtn.getAttribute("data-opt"), 10)); return; }
  /* 语法 */
  const gcatBtn = t.closest("[data-gcat]");
  if (gcatBtn){ UI.grammarFilter.category = gcatBtn.getAttribute("data-gcat"); render(); return; }
  const glevelBtn = t.closest("[data-glevel]");
  if (glevelBtn){ UI.grammarFilter.level = glevelBtn.getAttribute("data-glevel"); render(); return; }
  const gscopeBtn = t.closest("[data-gscope]");
  if (gscopeBtn){ UI.grammarFilter.scope = gscopeBtn.getAttribute("data-gscope"); render(); return; }
  const gopenBtn = t.closest("[data-gopen]");
  if (gopenBtn){ UI.grammarDetail = gopenBtn.getAttribute("data-gopen"); UI.grammarQuiz = null; render(); window.scrollTo({ top:0, behavior:"smooth" }); return; }
  const gfavBtn = t.closest("[data-gfav]");
  if (gfavBtn){ toggleGrammarFavorite(gfavBtn.getAttribute("data-gfav")); return; }
  const glearnBtn = t.closest("[data-glearn]");

  const goptBtn = t.closest("[data-gopt]");

function recordNewOrReview(wordId){
  /* 备用：仅用于"标记已掌握"这类不经过反馈按钮的操作补充计数 */
  const s = wsOf(wordId);
  if (s.firstLearned === todayStr()) return;
  recordNewWord(wordId);
}
function quickFeedback(wordId, feedback){
  const w = WORD_MAP[wordId];
  if (!w) return;
  const wasNew = wsOf(wordId).status === "new";
  const res = scheduleReview(wordId, feedback);
  if (wasNew){
    if (feedback === "unknown") { /* 不认识的"新词"仍视为已接触 */ }
    recordNewWord(wordId);
  } else {
    recordReview(wordId);
  }
  if (feedback === "unknown") addMistakeFromWord(w, "不认识");
  toast(w.word + " → " + res.message + "（熟悉度 " + res.familiarity + "）", feedback === "know" ? "ok" : feedback === "unknown" ? "warn" : "");
  checkInIfDone();
  render();
}
function handleCardAction(action){
  const list = filterWords();
  if (!list.length) return;
  if (action === "shuffle"){
    UI.cardQueue = shuffle(list.map(function(w){ return w.id; }));
    UI.cardIndex = 0;
    render();
    toast("卡片顺序已随机打乱", "ok");
    return;
  }
  if (action === "prev"){
    const ids = UI.cardQueue.length ? UI.cardQueue : list.map(function(w){ return w.id; });
    UI.cardIndex = (UI.cardIndex - 1 + ids.length) % ids.length;
    render();
    return;
  }
  if (action === "next"){
    const ids = UI.cardQueue.length ? UI.cardQueue : list.map(function(w){ return w.id; });
    UI.cardIndex = (UI.cardIndex + 1) % ids.length;
    render();
    return;
  }
  const id = UI.cardQueue[UI.cardIndex];
  if (!id) return;
  quickFeedback(id, action === "know" ? "know" : action === "fuzzy" ? "fuzzy" : "unknown");
  const ids = UI.cardQueue.length ? UI.cardQueue : list.map(function(w){ return w.id; });
  UI.cardIndex = (UI.cardIndex + 1) % ids.length;
  render();
}

function toggleGrammarFavorite(gid){
  const g = GRAMMAR_MAP[gid];
  if (!g) return;
  ST.grammarStats[gid] = ST.grammarStats[gid] || { learned:false, favorite:false };
  ST.grammarStats[gid].favorite = !ST.grammarStats[gid].favorite;
  saveState();
  toast(ST.grammarStats[gid].favorite ? "已收藏语法点 ⭐" : "已取消收藏", ST.grammarStats[gid].favorite ? "ok" : "");
  render();
}
function toggleGrammarLearned(gid){
  const g = GRAMMAR_MAP[gid];
  if (!g) return;
  ST.grammarStats[gid] = ST.grammarStats[gid] || { learned:false, favorite:false };
  const next = !ST.grammarStats[gid].learned;
  ST.grammarStats[gid].learned = next;
  if (next && !ST.grammarStats[gid].counted){
    ST.grammarStats[gid].counted = true;
    recordGrammar();
    toast("已标记「" + g.title + "」为已学，并计入今日语法任务", "ok");
  } else {
    toast(next ? "已标记为已学" : "已取消已学标记", next ? "ok" : "");
  }
  checkInIfDone();
  saveState();
  render();
}

/* 6.7 动作分发 ------------------------------------------------------- */
function handleAction(action){
  switch(action){
    case "checkin": {
      const tasks = todayTasks();
      if (!tasks.allDone){
        confirmDialog("提前打卡？", "今日任务尚未全部完成（新词 " + tasks.newDone + "/" + tasks.newTarget + "，复习 " + tasks.reviewDone + "/" + Math.max(dueWords().length,1) + "，语法 " + tasks.grammarDone + "/" + tasks.grammarTarget + "，测验 " + tasks.quizDone + "/" + tasks.quizTarget + "）。仍然要打卡吗？", function(){
          checkIn();
          toast("打卡成功 🔥 连续 " + streakDays() + " 天", "ok");
          render();
        }, "仍然打卡");
        return;
      }
      checkIn();
      toast("打卡成功 🔥 连续 " + streakDays() + " 天", "ok");
      render();
      return;
    }
    case "clearFilter":
      UI.wordFilter = { keyword:"", level:"all", tag:"all", scope:"all", page:1, sort:"default" };
      UI.cardIndex = 0;
      render();
      return;
    case "clearGrammarFilter":
      UI.grammarFilter = { keyword:"", category:"all", level:"all", scope:"all" };
      render();
      return;
    case "backGrammar":
      UI.grammarDetail = null;
      UI.grammarQuiz = null;
      render();
      return;
    case "startReview": startReviewSession(false); return;
    case "reviewAll": startReviewSession(true); return;
    case "startNew": startNewSession(); return;
    case "quickStudy": startMixedSession(); return;
    case "reveal": if (UI.studySession){ UI.studySession.revealed = true; render(); } return;
    case "skipWord":
      if (UI.studySession){
        UI.studySession.index++;
        UI.studySession.revealed = false;
        if (UI.studySession.index >= UI.studySession.queue.length){ UI.studySession.finished = true; flushDuration(); }
        render();
      }
      return;
    case "endSession":
      if (UI.studySession){
        UI.studySession.finished = true;
        flushDuration();
        render();
        toast("本次学习已结束，进度已保存", "ok");
      }
      return;
    case "studyAgain":
      UI.studySession = null;
      startMixedSession();
      return;
    case "startQuiz": {
      const type = byId("quizType") ? byId("quizType").value : "mixed";

function fallbackCopy(text){
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    toast("学习数据已复制到剪贴板", "ok");
  }catch(err){
    toast("复制失败，请使用「导出数据」按钮", "err");
  }
}
function pickFile(accept, onText){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = accept;
  input.style.display = "none";
  input.addEventListener("change", function(){
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(){ onText(String(reader.result)); };
    reader.onerror = function(){ toast("文件读取失败，请重试", "err"); };
    reader.readAsText(file, "utf-8");
  });
  document.body.appendChild(input);
  input.click();
  setTimeout(function(){ if (input.parentNode) input.parentNode.removeChild(input); }, 60000);
}

/* 6.8 主题切换 ------------------------------------------------------- */
function applyTheme(theme){
  const t = theme === "dark" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
  const btn = byId("themeBtn");
  if (btn) btn.textContent = t === "dark" ? "☀️" : "🌙";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", t === "dark" ? "#10131c" : "#5b6cff");
}
function toggleTheme(){
  ST.settings.theme = ST.settings.theme === "dark" ? "light" : "dark";
  applyTheme(ST.settings.theme);
  saveState();
  toast(ST.settings.theme === "dark" ? "已切换到深色模式 🌙" : "已切换到浅色模式 ☀️", "ok");
  render();
}

/* ==========================================================================
   [PART 7] 启动流程：事件绑定、路由恢复、首次引导
   ========================================================================== */
function boot(){
  try{
    ST = loadState();
    applyTheme(ST.settings.theme);
    /* 恢复路由 */
    const hash = (location.hash || "").replace(/^#\/?/, "");
    if (ROUTES.indexOf(hash) >= 0) currentPage = hash;
    /* 默认筛选等级跟随考试类型 */
    UI.wordFilter.level = "all";
    rebuildIndex();
    render();
    /* 首次使用引导 */
    if (!ST.meta.onboarded){
      ST.meta.onboarded = true;
      saveState({ silent:true });
      setTimeout(showWelcome, 300);
    }
    /* 定期刷新复习到期状态（每 5 分钟） */
    const refresh = setInterval(function(){
      if (["dashboard","review"].indexOf(currentPage) >= 0) render();
    }, 5 * 60 * 1000);
    globalTimers.push(refresh);
    /* 语音列表异步加载（部分浏览器首次为空） */
    if (speechSupported && typeof window.speechSynthesis.getVoices === "function"){
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = function(){ window.speechSynthesis.getVoices(); };
    }
    /* 启动后异步加载本地大词库（不阻塞首屏：先渲染内置词库，加载完再重绘） */
    bootWordBank();
  }catch(err){
    console.error("[CET] 启动失败", err);
    setView('<div class="notice err"><span>⚠️</span><span>应用启动失败：' + esc(err.message || String(err)) + '</span></div>' +
      '<div class="btn-row"><button class="btn primary" onclick="location.reload()">重新加载</button>' +
      '<button class="btn" onclick="try{localStorage.removeItem(\'' + STORAGE_KEY + '\');location.reload();}catch(e){}">清除本地数据并重载</button></div>');
  }
}
/* 词库加载：显示加载态 → 读取合并 → 重新渲染；失败则回退内置词库并给出指引 */
async function bootWordBank(){
  const startedAt = Date.now();
  BANK.error = null;
  BANK.loading = true;
  /* 若 .js 词库已由页面顶部的 script 标签预载完成（file:// 场景），就不必再拉长加载动画 */
  const preloaded = WORD_FILES.filter(function(cfg){ return !!preloadedWordData(cfg.key); }).length;
  if (!preloaded) setView(wordBankLoadingHTML());
  let timer = setTimeout(function(){
    /* 已加载完成、或用户已跳过、或已切走时不再干扰界面 */
    if (BANK.loaded || !BANK.loading) return;
    setView(wordBankLoadingHTML() +
      '<div class="notice"><span>⏳</span><span>仍在读取词库文件（约 7 MB），请稍候…若长时间无响应，请检查 data/ 目录是否存在，或点击下方按钮先用入门词库继续。</span></div>' +
      '<div class="btn-row center"><button class="btn" id="skipBankBtn">先用入门词库</button></div>');
    const skip = byId("skipBankBtn");
    if (skip) skip.addEventListener("click", function(){
      BANK.loading = false;
      BANK.error = "用户跳过加载";
      render();
    });
  }, 15000);
  pageTimers.push(timer);
  try{
    await loadWordBank();
    clearTimeout(timer);
    BANK.error = null;
    render();
    if (BANK.files.length){
      toast("词库加载完成：共 " + WORDS.length + " 词（" + BANK.files.map(function(f){ return "CET-" + f.level + " " + f.count; }).join(" + ") + "）", "ok");
    }
  }catch(err){
    clearTimeout(timer);
    BANK.loading = false;
    BANK.error = err && err.message ? err.message : String(err);
    console.warn("[CET] 大词库加载失败，回退到内置词库", err);
    rebuildIndex();
    render();
    toast("本地大词库加载失败，已使用入门词库（可点击页面提示重试）", "warn");
  }
  console.info("[CET] 启动耗时 " + (Date.now() - startedAt) + " ms，当前词库 " + WORDS.length + " 条");
}
/* 手动重新加载词库 */
async function reloadWordBank(){
  if (typeof window !== "undefined"){
    /* 清掉之前的 404 标记，允许重试同一路径（例如刚生成 .js 文件） */
    delete window.__cetJs4Failed;
    delete window.__cetJs6Failed;
    window.CET4_WORDS = window.CET4_WORDS || undefined;
    window.CET6_WORDS = window.CET6_WORDS || undefined;
  }
  /* 动态补挂一次 script（用户刚转换出 .js 文件、还没刷新页面的场景） */
  await injectBankScripts();
  await bootWordBank();
}
/* 动态注入词库 script（重复注入同名脚本不会重复执行旧代码，失败也只是 404） */
function injectBankScripts(){
  return new Promise(function(resolve){
    if (typeof document === "undefined" || !document.body) return resolve();
    let pending = 0, done = false;
    WORD_FILES.forEach(function(cfg){
      if (preloadedWordData(cfg.key)) return;      // 已加载过就不重复注入
      pending++;
      const s = document.createElement("script");
      s.src = WORD_DATA_DIR + cfg.file + ".js";
      s.async = false;
      s.onload = function(){ pending--; if (!pending && !done){ done = true; resolve(); } };
      s.onerror = function(){ pending--; if (!pending && !done){ done = true; resolve(); } };
      document.body.appendChild(s);
    });
    if (!pending) resolve();
    setTimeout(function(){ if (!done){ done = true; resolve(); } }, 8000);
  });
}

      '<p style="margin-top:8px">' + (speechSupported ? "🔊 当前浏览器支持单词发音。" : "⚠️ 当前浏览器不支持发音（Web Speech API 不可用）。") + '</p>' +
      '</div>',
    footer:'<button class="btn" data-act="showStructure">查看数据结构</button>' +
      '<button class="btn primary" data-close="1">开始学习</button>'
  });
}

/* 事件绑定 */
view.addEventListener("click", onViewClick);
byId("themeBtn").addEventListener("click", toggleTheme);
byId("sideNav").addEventListener("click", function(e){
  const b = e.target.closest("[data-nav]");
  if (b) goPage(b.getAttribute("data-nav"));
});
byId("sideNav2").addEventListener("click", function(e){
  const b = e.target.closest("[data-nav]");
  if (b) goPage(b.getAttribute("data-nav"));
});
byId("bottomNav").addEventListener("click", function(e){
  const b = e.target.closest("[data-nav]");
  if (b) goPage(b.getAttribute("data-nav"));
});
window.addEventListener("hashchange", function(){
  const hash = (location.hash || "").replace(/^#\/?/, "");
  if (ROUTES.indexOf(hash) >= 0 && hash !== currentPage) goPage(hash);
});
/* 进入输入框时提交拼写答案（回车键，事件委托） */
document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && e.target && e.target.classList && e.target.classList.contains("blank-input")){
    const q = UI.quiz;
    if (q && !q.answered){ e.preventDefault(); answerQuiz(undefined, e.target.value); }
  }
});
/* 离开页面前保存时长 */
window.addEventListener("beforeunload", function(){ try{ flushDuration(); }catch(e){} });
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ try{ flushDuration(); }catch(e){} }
  else pageEnterTs = Date.now();
});
/* 启动 */
boot();

</script>
</body>
</html>

<!DOCTYPE html>
<!-- ==========================================================================
     CET 四六级学习助手  ·  Single-File English Learning App
     模块索引（便于定位与维护）:
       [PART 1] HTML 骨架 + 侧边栏/移动端底部导航 + 全部样式
       [PART 2] 词库数据(40+ 词) + 语法数据(12 个语法点)
       [PART 3] 状态层 localStorage(cet-app-v1) + 间隔重复算法 + 工具函数
       [PART 4] 页面渲染: 仪表盘 / 词汇 / 背诵复习 / 测验 / 语法
       [PART 5] 页面渲染: 计划 / 进度统计 / 错题收藏 / 设置 + 事件绑定 + 启动
     技术: 纯 HTML + CSS + 原生 JS（Tailwind / Chart.js 仅作可选 CDN 增强）
     ========================================================================== -->
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#5b6cff" />
<meta name="description" content="CET 四六级学习助手：词汇学习、间隔重复复习、测验中心、语法精讲、学习计划与进度统计，数据保存在本地浏览器。" />
<title>CET 四六级学习助手</title>
<!-- 可选增强：Chart.js（加载失败时自动降级为纯 CSS 图表） -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" onerror="window.__chartFail=true"></script>
<!--
  ============================================================================
  本地大词库加载入口（推荐，可支持 file:// 直接双击打开）
  ----------------------------------------------------------------------------
  · 若存在同目录 data/words-cet4.js 与 data/words-cet6.js，会在此处被优先加载，
    由 script 标签直接赋值给 window.CET4_WORDS / window.CET6_WORDS。
    script 标签不受 fetch 的 CORS 限制，因此双击打开也能拿到全部 13000+ 词条。
  · 若只有 .json 文件（没有 .js），应用会在启动时用 fetch 读取
    data/words-cet4.json / data/words-cet6.json —— 这需要 http:// 环境（本地服务器）。
  · 两者都没有时自动回退到内置的入门词库，功能完全可用。
  ============================================================================
-->
<script src="data/words-cet4.js" onerror="window.__cetJs4Failed=true"></script>
<script src="data/words-cet6.js" onerror="window.__cetJs6Failed=true"></script>
<style>
/* ===================== [PART 1-A] 主题变量与基础重置 ===================== */
:root{
  --bg:#f4f6fb; --bg2:#ffffff; --card:#ffffff; --soft:#f7f8fd;
  --text:#161b2e; --text2:#5b6480; --text3:#8b93ab;
  --border:#e5e8f2; --primary:#5b6cff; --primary2:#8b95ff; --primary-soft:#eef0ff;
  --ok:#12a37a; --ok-soft:#e6f7f1; --warn:#e08c14; --warn-soft:#fdf3e2;
  --bad:#e04f4f; --bad-soft:#fdeceb; --accent:#14b8a6;
  --shadow:0 1px 2px rgba(20,26,60,.05),0 8px 24px rgba(20,26,60,.06);
  --shadow2:0 12px 36px rgba(20,26,60,.14);
  --radius:16px; --sidebar-w:236px;
}
[data-theme="dark"]{
  --bg:#10131c; --bg2:#161a26; --card:#171b27; --soft:#1d2231;
  --text:#e9ecf5; --text2:#98a1bb; --text3:#6f7791;
  --border:#272d3e; --primary:#7d88ff; --primary2:#5b6cff; --primary-soft:#232a4a;
  --ok:#38c79a; --ok-soft:#17352c; --warn:#e3ac52; --warn-soft:#382c14;
  --bad:#f2726f; --bad-soft:#3a1f21; --accent:#2dd4bf;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  --shadow2:0 14px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font-family:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.6; transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding-left:18px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--primary);text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--primary);color:#fff}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.hidden{display:none !important}
.muted{color:var(--text2)}
.tiny{font-size:12.5px}
.center{text-align:center}
.mono{font-variant-numeric:tabular-nums}

/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ===================== [PART 1-B] 布局骨架 ===================== */
.app{display:block;min-height:100vh}
.sidebar{display:none}
.main{min-height:100vh;display:flex;flex-direction:column}
.content{
  flex:1; padding:14px 14px calc(88px + env(safe-area-inset-bottom,0px));
  max-width:1180px; width:100%; margin:0 auto;
}

/* ===================== [PART 1-C] 顶栏 ===================== */
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:saturate(180%) blur(12px);
  background:var(--bg);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  border-bottom:1px solid var(--border);
  padding:10px 14px;display:flex;align-items:center;gap:10px;
}
[data-theme="dark"] .topbar{background:rgba(16,19,28,.86)}
.topbar h1{font-size:16.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.topbar .brand-dot{
  width:26px;height:26px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;
}
.top-pill{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  background:var(--warn-soft);color:var(--warn);border:1px solid transparent;
  padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;
}
.icon-btn{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--border);
  background:var(--card);display:grid;place-items:center;font-size:16px;
  transition:transform .12s ease,border-color .12s ease,background .12s ease;
}
.icon-btn:hover{border-color:var(--primary);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.94)}

/* ===================== [PART 1-D] 移动端底部导航 ===================== */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:space-between;gap:2px;
  background:var(--bg2);border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -6px 20px rgba(20,26,60,.07);
}
.bn-item{
  flex:1 1 0;min-width:2.25rem;
  background:none;border:0;padding:5px 1px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--text3);font-size:10.5px;font-weight:600;transition:color .15s ease;
}
.bn-item .bn-ico{font-size:17px;line-height:1}
.bn-item.active{color:var(--primary)}
.bn-item.active .bn-ico{transform:translateY(-1px)}

/* ===================== [PART 1-E] 通用组件 ===================== */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin-bottom:14px;
}
.card.tight{padding:13px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:15.5px;font-weight:700}
.card-h .sub{font-size:12.5px;color:var(--text3)}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.section-title{display:flex;align-items:center;gap:9px;margin:2px 0 12px}
.section-title h2{font-size:18px;font-weight:750;letter-spacing:.2px}
.section-title p{font-size:12.5px;color:var(--text3)}
.page-head{margin-bottom:14px}
.page-head h2{font-size:20px;font-weight:750;display:flex;align-items:center;gap:8px}
.page-head p{color:var(--text2);font-size:13px;margin-top:3px}

.btn{
  border:1px solid var(--border);background:var(--card);color:var(--text);
  padding:9px 15px;border-radius:11px;font-size:13.5px;font-weight:650;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .12s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;
  white-space:nowrap;line-height:1.35;
}
.btn:hover{border-color:var(--primary);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.985)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(91,108,255,.28)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.btn-row{display:flex;gap:9px;flex-wrap:wrap}
.btn-row.center{justify-content:center}

.tag{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
  font-size:11.5px;font-weight:650;background:var(--soft);color:var(--text2);border:1px solid var(--border);
}
.tag.lv4{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.tag.lv6{background:#f0e9ff;color:#7a52e0;border-color:transparent}
[data-theme="dark"] .tag.lv6{background:#2b2447;color:#b49bff}
.tag.hot{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

.chip{
  border:1px solid var(--border);background:var(--card);color:var(--text2);
  padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
  transition:all .15s ease;white-space:nowrap;
}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(91,108,255,.28)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip-row.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:650;color:var(--text2)}
.input,select.input,textarea.input{
  background:var(--card);border:1px solid var(--border);border-radius:11px;
  padding:9px 12px;font-size:14px;width:100%;transition:border-color .15s ease,box-shadow .15s ease;
}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea.input{resize:vertical;min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55}
.form-grid{display:grid;gap:13px;grid-template-columns:1fr}
.range-row{display:flex;align-items:center;gap:10px}
input[type="range"]{flex:1;accent-color:var(--primary)}
.range-val{min-width:56px;text-align:right;font-weight:700;color:var(--primary)}

.progress{height:9px;border-radius:999px;background:var(--soft);overflow:hidden;border:1px solid var(--border)}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress.sm{height:6px}

.empty{text-align:center;padding:34px 18px;color:var(--text2)}
.empty .em-ico{font-size:34px;display:block;margin-bottom:10px;opacity:.85}
.empty h4{font-size:15px;color:var(--text);margin-bottom:5px}
.empty p{font-size:13px;max-width:420px;margin:0 auto 14px}

.notice{
  border-radius:12px;padding:11px 13px;font-size:13px;display:flex;gap:9px;align-items:flex-start;
  background:var(--warn-soft);color:var(--warn);border:1px solid transparent;margin-bottom:12px;
}
.notice.info{background:var(--primary-soft);color:var(--primary)}
.notice.err{background:var(--bad-soft);color:var(--bad)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}

.loading{display:grid;place-items:center;padding:56px 0;gap:12px;color:var(--text3)}
.spinner{
  width:30px;height:30px;border-radius:50%;
  border:3px solid var(--border);border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===================== [PART 1-F] 仪表盘 ===================== */
.hero{
  background:linear-gradient(135deg,var(--primary),#7b5cff 55%,var(--accent));
  color:#fff;border-radius:18px;padding:18px;margin-bottom:14px;
  box-shadow:0 12px 30px rgba(91,108,255,.3);position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-60px;width:190px;height:190px;
  background:rgba(255,255,255,.13);border-radius:50%;
}
.hero h2{font-size:18.5px;font-weight:750;position:relative}
.hero p{font-size:13px;opacity:.94;margin-top:4px;position:relative;max-width:640px}
.hero-stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;position:relative}
.hero-stat{
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);
  border-radius:13px;padding:9px 12px;min-width:82px;backdrop-filter:blur(4px);
}
.hero-stat span{display:block;font-size:11.5px;opacity:.9;font-weight:600}
.hero-stat b{font-size:19px;font-weight:800;letter-spacing:.3px}

.grid{display:grid;gap:12px}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(2,1fr)}
.grid.c4{grid-template-columns:repeat(2,1fr)}
.task-item{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;
  background:var(--soft);border:1px solid transparent;transition:border-color .15s ease;
}
.task-item + .task-item{margin-top:9px}
.task-item:hover{border-color:var(--border)}
.task-ico{
  width:38px;height:38px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;
  font-size:17px;background:var(--card);border:1px solid var(--border);
}
.task-body{flex:1;min-width:0}
.task-body b{font-size:14px;display:block}
.task-body span{font-size:12px;color:var(--text3)}
.task-body .progress{margin-top:6px}

.quick-grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.quick{
  border:1px solid var(--border);background:var(--card);border-radius:14px;padding:14px 12px;
  display:flex;flex-direction:column;gap:5px;text-align:left;transition:all .15s ease;
}
.quick:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.quick .q-ico{font-size:20px}
.quick b{font-size:13.5px}
.quick span{font-size:11.5px;color:var(--text3)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-d{
  aspect-ratio:1;border-radius:9px;border:1px solid var(--border);background:var(--soft);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:10.5px;color:var(--text3);position:relative;padding:2px;
}
.cal-d b{font-size:11.5px;color:var(--text2)}
.cal-d.l1{background:var(--primary-soft);border-color:transparent}
.cal-d.l1 b{color:var(--primary)}
.cal-d.l2{background:var(--primary2);background:color-mix(in srgb,var(--primary) 42%,var(--card));border-color:transparent}
.cal-d.l2 b,.cal-d.l2 span{color:#fff}
.cal-d.l3{background:var(--primary);border-color:transparent}
.cal-d.l3 b,.cal-d.l3 span{color:#fff}
.cal-d .cal-dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.8}
.cal-legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--text3);margin-top:10px}
.cal-legend i{width:12px;height:12px;border-radius:4px;display:inline-block;vertical-align:-2px;margin-right:4px;border:1px solid var(--border)}

.chart-wrap{position:relative;width:100%;height:220px}
.chart-wrap canvas{width:100% !important;height:100% !important}
.fallback-chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding:8px 4px 0}
.fb-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.fb-bar{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--primary),var(--primary2));min-height:3px;transition:height .4s ease}
.fb-bar.b2{background:linear-gradient(180deg,var(--accent),#0f9c8f)}
.fb-lbl{font-size:10.5px;color:var(--text3);white-space:nowrap}

/* ===================== [PART 1-G] 词汇与闪卡 ===================== */
.word-card{
  background:linear-gradient(160deg,var(--card),var(--soft));
  border:1px solid var(--border);border-radius:18px;padding:20px 16px;
  text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.word-card .wc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;position:absolute;left:14px;right:14px;top:13px}
.word-big{font-size:31px;font-weight:800;letter-spacing:.4px;word-break:break-word;line-height:1.25;margin-top:8px}
.phonetic{color:var(--text2);font-size:14px;margin-top:3px;font-family:ui-monospace,Menlo,Consolas,monospace}
.speak-btn{
  margin-top:12px;border:1px solid var(--border);background:var(--card);border-radius:999px;
  padding:7px 15px;font-size:13px;font-weight:650;display:inline-flex;gap:6px;align-items:center;
}
.speak-btn:hover{border-color:var(--primary);color:var(--primary)}
.speak-btn.playing{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.word-meaning{margin-top:16px;display:flex;flex-direction:column;gap:11px;text-align:left}
.mn-row{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
.mn-row .k{
  flex:0 0 66px;color:var(--text3);font-size:12px;font-weight:700;padding-top:2px;
}
.mn-row .v{flex:1;min-width:0}
.mn-row .v b{color:var(--text);font-weight:650}
.ex-sent{font-size:14px;color:var(--text);line-height:1.7}
.ex-cn{font-size:12.5px;color:var(--text3);margin-top:2px}
mark.hl{background:var(--warn-soft);color:var(--warn);padding:0 3px;border-radius:4px;font-weight:650}

.fc-stage{perspective:1400px}
.fc{
  position:relative;min-height:298px;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.4,.2,.2,1);cursor:pointer;
}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:18px;border:1px solid var(--border);background:var(--card);
  box-shadow:var(--shadow);padding:22px 16px;overflow:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
.fc-face.back{transform:rotateY(180deg);align-items:stretch;justify-content:flex-start;text-align:left}
.fc-hint{position:absolute;bottom:11px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--text3)}

.list-toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.list-toolbar .input{flex:1;min-width:170px}
.word-list{display:grid;gap:9px}
.wl-item{
  display:flex;gap:11px;align-items:center;padding:12px;border-radius:13px;
  border:1px solid var(--border);background:var(--card);transition:all .15s ease;
}
.wl-item:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.wl-main{flex:1;min-width:0}
.wl-main .w-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.wl-main .w{font-size:16.5px;font-weight:750}
.wl-main .ph{font-size:12px;color:var(--text3);font-family:ui-monospace,monospace}
.wl-main .mn{font-size:13px;color:var(--text2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wl-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:340px}
.mini-btn{
  width:33px;height:33px;border-radius:10px;border:1px solid var(--border);background:var(--card);
  display:grid;place-items:center;font-size:14px;transition:all .13s ease;
}
.mini-btn:hover{border-color:var(--primary);transform:translateY(-1px)}
.mini-btn.on{background:var(--warn-soft);border-color:transparent}
.mini-btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.mini-btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
.pager span{font-size:12.5px;color:var(--text2);font-weight:600}

/* ===================== [PART 1-H] 测验与练习 ===================== */
.quiz-top{display:flex;align-items:center;gap:11px;margin-bottom:12px;flex-wrap:wrap}
.quiz-top .progress{flex:1;min-width:130px}
.opt{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  border:1px solid var(--border);background:var(--card);border-radius:13px;
  padding:13px 14px;font-size:14.5px;transition:all .14s ease;
}
.opt + .opt{margin-top:9px}
.opt:hover:not(.locked){border-color:var(--primary);transform:translateX(2px);box-shadow:var(--shadow)}
.opt .idx{
  width:27px;height:27px;flex:0 0 auto;border-radius:9px;background:var(--soft);
  display:grid;place-items:center;font-size:12.5px;font-weight:750;color:var(--text2);
}
.opt .opt-text{flex:1;min-width:0}
.opt.correct{background:var(--ok-soft);border-color:var(--ok)}
.opt.correct .idx{background:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .idx{background:var(--bad);color:#fff}
.opt.locked{cursor:default}
.opt.dim{opacity:.55}

.blank-input{
  font-size:22px;letter-spacing:4px;text-align:center;font-weight:750;
  padding:13px;border-radius:13px;border:1px solid var(--border);background:var(--card);
  width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;
}
.blank-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.blank-code{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:23px;font-weight:750;
  letter-spacing:7px;text-align:center;padding:12px 8px;background:var(--soft);
  border-radius:13px;border:1px dashed var(--border);word-break:break-all;
}
.feedback{border-radius:13px;padding:13px;font-size:13.5px;margin-top:13px;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback b{display:block;margin-bottom:4px;font-size:14.5px}
.feedback .ana{color:var(--text);font-size:13px;margin-top:7px;line-height:1.7}
.feedback .ana .k{color:var(--text3);font-weight:700;margin-right:5px}

.result-hero{text-align:center;padding:24px 14px;border-radius:18px;background:var(--soft);border:1px solid var(--border)}
.result-score{font-size:46px;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.result-hero p{color:var(--text2);font-size:13px;margin-top:7px}
.res-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:15px}
.res-cell{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px;text-align:center}
.res-cell b{display:block;font-size:20px;font-weight:800}
.res-cell span{font-size:11.5px;color:var(--text3)}

.wrong-item{border-left:3px solid var(--bad);background:var(--soft);border-radius:11px;padding:11px 13px;font-size:13px}
.wrong-item + .wrong-item{margin-top:9px}
.wrong-item .q{font-weight:650}
.wrong-item .a{font-size:12.5px;color:var(--text2);margin-top:4px}
.wrong-item .a i{font-style:normal;color:var(--bad);font-weight:700}
.wrong-item .a em{font-style:normal;color:var(--ok);font-weight:700}

/* ===================== [PART 1-I] 语法 ===================== */
.grammar-card{
  border:1px solid var(--border);background:var(--card);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:8px;transition:all .15s ease;height:100%;
}
.grammar-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.grammar-card h4{font-size:15px;font-weight:750}
.grammar-card p{font-size:12.5px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.grammar-card .gc-foot{display:flex;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.g-rule{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:11px;background:var(--soft);font-size:13.5px}
.g-rule + .g-rule{margin-top:8px}
.g-rule .num{
  flex:0 0 21px;height:21px;border-radius:7px;background:var(--primary);color:#fff;
  display:grid;place-items:center;font-size:11.5px;font-weight:750;margin-top:2px;
}
.g-ex{padding:10px 12px;border-radius:11px;background:var(--soft);font-size:13.5px}
.g-ex + .g-ex{margin-top:8px}
.g-ex .en{font-weight:600}
.g-ex .cn{font-size:12.5px;color:var(--text3);margin-top:2px}
.mistake-box{border-left:3px solid var(--bad);background:var(--bad-soft);border-radius:11px;padding:10px 12px;font-size:13px}
.mistake-box + .mistake-box{margin-top:8px}
.mistake-box b{color:var(--bad)}

/* ===================== [PART 1-J] 统计 / 错题 / 设置 ===================== */
.stat-tile{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:2px}
.stat-tile b{font-size:21px;font-weight:800;letter-spacing:.3px}
.stat-tile span{font-size:12px;color:var(--text3);font-weight:600}
.stat-tile .ico{font-size:15px;margin-bottom:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text2);margin-top:12px}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block;margin-right:5px;vertical-align:-1px}
.bar-line{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bar-line .bl-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text2)}
.bar-line .bl-top b{color:var(--text)}

.mk-item{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:13px;background:var(--card)}
.mk-item + .mk-item{margin-top:9px}
.mk-item .mk-main{flex:1;min-width:0}
.mk-item .mk-w{font-size:15.5px;font-weight:750}
.mk-item .mk-sub{font-size:12.5px;color:var(--text2);margin-top:3px;line-height:1.6}
.mk-item .mk-sub em{font-style:normal;color:var(--bad);font-weight:650}
.mk-item .mk-sub i{font-style:normal;color:var(--ok);font-weight:650}

.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row .sr-body{flex:1;min-width:180px}
.set-row .sr-body b{font-size:14px;display:block}
.set-row .sr-body span{font-size:12px;color:var(--text3)}
.switch{
  width:48px;height:27px;border-radius:999px;border:1px solid var(--border);background:var(--soft);
  position:relative;flex:0 0 auto;transition:background .2s ease;
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .2s ease;
}
.switch.on{background:var(--primary);border-color:var(--primary)}
.switch.on::after{transform:translateX(21px)}
.data-grid{display:grid;gap:10px;grid-template-columns:1fr}
code.k{background:var(--soft);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:12px;font-family:ui-monospace,monospace}

/* ===================== [PART 1-K] 模态框 / 提示 / 页脚 ===================== */
.modal{
  position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  padding:18px;background:rgba(10,14,30,.5);backdrop-filter:blur(3px);animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--bg2);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow2);
  width:100%;max-width:520px;max-height:86vh;overflow:auto;padding:18px;animation:pop .22s ease;
}
.modal-h{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.modal-h h3{font-size:16.5px;font-weight:750;flex:1}
.modal-f{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

#toasts{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{
  background:#1d2338;color:#fff;border-radius:12px;padding:10px 15px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow2);animation:up .25s ease;max-width:420px;
}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--bad)}
.toast.warn{background:var(--warn)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.foot{text-align:center;color:var(--text3);font-size:11.5px;padding:6px 0 18px;line-height:1.7}

/* ===================== [PART 1-L] 响应式（桌面端侧边栏） ===================== */
@media (min-width:640px){
  .grid.c2{grid-template-columns:repeat(2,1fr)}
  .grid.c4{grid-template-columns:repeat(4,1fr)}
  .quick-grid{grid-template-columns:repeat(3,1fr)}
  .form-grid{grid-template-columns:repeat(2,1fr)}
  .data-grid{grid-template-columns:repeat(2,1fr)}
  .res-grid{grid-template-columns:repeat(4,1fr)}
  .content{padding:20px 22px 40px}
  .fc{min-height:340px}
  .topbar{padding:12px 22px}
}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr)}
  .bottom-nav{display:none}
  .content{padding:24px 30px 46px;max-width:1120px}
  .topbar-left{display:none}
  .sidebar{
    display:flex;flex-direction:column;gap:6px;
    background:var(--bg2);border-right:1px solid var(--border);
    padding:18px 13px;position:sticky;top:0;height:100vh;overflow:auto;
  }
  .side-logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
  .side-logo .brand-dot{width:34px;height:34px;border-radius:11px;font-size:14px}
  .side-logo b{font-size:15.5px;font-weight:750;line-height:1.25;display:block}
  .side-logo i{font-style:normal;font-size:11px;color:var(--text3)}
  .side-group{font-size:10.5px;font-weight:700;color:var(--text3);letter-spacing:.8px;padding:12px 10px 5px;text-transform:uppercase}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;border:0;
    background:transparent;color:var(--text2);font-size:13.5px;font-weight:650;text-align:left;
    transition:all .14s ease;width:100%;
  }
  .nav-item .ni{font-size:16px;width:20px;text-align:center;flex:0 0 auto}
  .nav-item:hover{background:var(--soft);color:var(--text)}
  .nav-item.active{background:var(--primary-soft);color:var(--primary)}
  .nav-item .badge{
    margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;
    font-size:10.5px;font-weight:750;padding:1px 7px;min-width:20px;text-align:center;
  }
  .side-foot{margin-top:auto;padding:10px 4px}
  .side-card{background:var(--soft);border:1px solid var(--border);border-radius:13px;padding:11px;font-size:12px;color:var(--text2)}
  .side-card b{display:block;font-size:12.5px;color:var(--text);margin-bottom:3px}
  #toasts{bottom:26px}
}
@media (min-width:1200px){
  :root{--sidebar-w:252px}
  .content{padding:26px 36px 50px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div class="app">
  <!-- ============ 桌面端侧边栏导航 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="side-logo">
      <span class="brand-dot">CET</span>
      <span><b>四六级学习助手</b><i id="sideSub">备考 CET-4 / CET-6</i></span>
    </div>
    <div class="side-group">学习</div>
    <nav id="sideNav" style="display:flex;flex-direction:column;gap:4px"></nav>
    <div class="side-group">工具</div>
    <nav id="sideNav2" style="display:flex;flex-direction:column;gap:4px"></nav>
    <div class="side-foot">
      <div class="side-card" id="sideStat"><b>加载中…</b>正在读取本地学习数据</div>
    </div>
  </aside>

  <div class="main">
    <!-- ============ 顶栏 ============ -->
    <header class="topbar">
      <span class="brand-dot topbar-left">CET</span>
      <h1 class="topbar-left">四六级学习助手</h1>
      <span class="top-pill" id="streakPill" title="连续打卡天数">🔥 <b id="streakNum">0</b> 天</span>
      <button class="icon-btn" id="themeBtn" title="切换浅色/深色主题" aria-label="切换主题">🌙</button>
    </header>

    <!-- ============ 主内容区 ============ -->
    <main class="content" id="view">
      <div class="loading"><div class="spinner"></div><span>正在初始化学习数据…</span></div>
    </main>

    <!-- ============ 移动端底部导航 ============ -->
    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>
</div>

<!-- 全局提示 -->
<div id="toasts" aria-live="polite"></div>
<!-- 模态框容器 -->
<div id="modalRoot"></div>

<script>
"use strict";
/* ==========================================================================
   [PART 2] 数据层：示例词库 + 语法题库

const WORD_ROWS = [
  /* ================= 四级核心词（20 个） ================= */
  ["c4-001","abandon","/əˈbændən/","vt.","放弃；抛弃；遗弃","to leave somebody/something and never return; to stop doing something completely","He decided to abandon the plan because of the heavy rain.","由于大雨，他决定放弃这个计划。","give up, desert, quit","keep, continue, maintain","a-(去) + band(约束) + -on → 解除约束，放手","abandon a plan / abandon ship / abandon oneself to","4",5,["高频","写作","阅读"]],

  ["c4-003","accurate","/ˈækjərət/","adj.","准确的；精确的","correct and exact in every detail","The weather forecast was surprisingly accurate this week.","本周的天气预报出奇地准确。","precise, exact, correct","inaccurate, wrong","ac-(加强) + cur(关心) + -ate → 用心做到精确","accurate data / accurate description / highly accurate","4",4,["高频","写作"]],
  ["c4-004","achieve","/əˈtʃiːv/","vt.","实现；取得；达到","to succeed in reaching a goal, especially by effort","You can achieve your goal if you practise every day.","如果每天练习，你就能实现目标。","accomplish, attain, reach","fail, lose","a-(去) + chief(头) + -eve → 到达顶点","achieve a goal / achieve success / achieve nothing","4",5,["高频","写作"]],

  ["c4-008","argue","/ˈɑːɡjuː/","v.","争论；主张；论证","to give reasons for or against something; to quarrel","Some students argue that homework should be reduced.","一些学生主张应该减少作业量。","debate, claim, contend","agree, consent","argu(使清楚) + -e → 把道理讲清楚","argue with sb. / argue that / argue for","4",4,["写作","口语"]],

    createdAt:0, firstLearned:""
  };
}

/* ==========================================================================
   [PART 3] 状态层 + 间隔重复算法 + 通用工具
   持久化 key 固定为 "cet-app-v1"
   ========================================================================== */
const STORAGE_KEY = "cet-app-v1";
const DATA_VERSION = 1;
/* 词库规模自适应分页：内置入门词库 12 条/页，上万条的大词库 24 条/页 */
let PAGE_SIZE = 12;
/* 大词库资源位置（相对于本 HTML 文件） */
const WORD_DATA_DIR = "data/";
const WORD_FILES = [
  { key:"4", file:"words-cet4", globals:["CET4_WORDS","WORDS_CET4"], level:"4" },
  { key:"6", file:"words-cet6", globals:["CET6_WORDS","WORDS_CET6"], level:"6" }
];

/* 3.1 间隔重复算法配置
   familiarity 0-5 → 复习间隔（天）：0:1, 1:1, 2:2, 3:4, 4:7, 5:15, 6:30
   规则：认识 familiarity +1；模糊 familiarity 不变（缩短间隔）；不认识重置为 0（1 天后复习） */
const INTERVALS = [1, 1, 2, 4, 7, 15, 30];
const FAMILIARITY_LABEL = ["完全陌生", "刚接触", "有印象", "较熟悉", "熟悉", "已掌握"];
const DAY_MS = 24 * 60 * 60 * 1000;
const HOUR_MS = 60 * 60 * 1000;

/* 3.2 内存状态（单一数据源，任何修改后立即 saveState()） */
let ST = null;
let pageTimers = [];        // 当前页面注册的定时器（切换页面时清理，不随每次重绘清理）
let globalTimers = [];      // 全局定时器（不随页面切换清理）
let chartRef = null;        // Chart.js 实例引用

/* 3.3 默认状态 */
function defaultState(){
  return {
    version: DATA_VERSION,
    settings: {
      examType: "4",            // 4 | 6
      dailyNew: 10,             // 每日新词数
      dailyReviewLimit: 30,     // 每日复习上限
      dailyGrammar: 1,          // 每日语法点数量
      dailyQuiz: 10,            // 每日测验题量
      theme: "light"            // light | dark
    },
    wordStats: {},              // wordId -> { status, familiarity, nextReview, lastReview, correctCount, wrongCount, favorite, note, firstLearned }
    grammarStats: {},           // grammarId -> { learned, favorite }
    records: {},                // "YYYY-MM-DD" -> { date, newWords, reviewedWords, grammarCount, quizTotal, quizCorrect, quizAccuracy, duration, completed }
    mistakes: [],               // 错题本
    meta: { createdAt: Date.now(), lastOpen: Date.now() }
  };
}

/* 3.4 读写 localStorage
   注意：localStorage **只保存学习进度**（wordStats / grammarStats / records / mistakes /
   settings / 自定义词条），绝不保存词库本体，因此上万条的大词库不会占用存储配额。
   另外保存前会剔除"空进度"条目（status 仍为 new 且无任何计数的占位对象），
   避免浏览词库时顺手创建的占位对象把配额撑满。 */
function isMeaningfulStat(s){
  if (!s) return false;
  return (s.status && s.status !== "new") ||
    !!s.favorite || !!s.note ||
    (s.correctCount || 0) > 0 || (s.wrongCount || 0) > 0 ||
    (s.familiarity || 0) > 0 || (s.nextReview || 0) > 0 || !!s.firstLearned;
}
function statsForSave(full){
  if (!full) return ST.wordStats;
  const out = {};
  for (const id in ST.wordStats){
    const s = ST.wordStats[id];
    /* 占位词条（词库中已不存在的历史进度）也要保留，否则进度会丢；
       status !== "new" 的条目本身就会被 isMeaningfulStat 保留 */
    if (isMeaningfulStat(s) || (s && (s.__word || s.__level))) out[id] = s;
  }
  return out;
}
function saveState(opts){
  const silent = !!(opts && opts.silent);
  ST.meta.lastOpen = Date.now();
  function attempt(stats){
    const payload = {
      version: ST.version,
      settings: ST.settings,
      wordStats: stats,
      grammarStats: ST.grammarStats,
      records: ST.records,
      mistakes: ST.mistakes,
      customWords: ST.customWords || [],
      meta: ST.meta
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  }
  try{
    attempt(ST.wordStats);
    ST.storageError = null;
    return true;
  }catch(err){
    /* 配额不足：先剔除空进度条目重试 */
    console.warn("[CET] 保存失败，尝试精简后重试", err);
    try{
      attempt(statsForSave(true));
      ST.storageError = null;
      if (!silent) toast("存储空间紧张，已自动精简保存（学习进度未丢失）", "warn");
      return true;
    }catch(err2){
      ST.storageError = err2.message || String(err2);
      console.error("[CET] 保存失败", err2);
      if (!silent){
        toast("保存失败：浏览器存储空间不足。词库不会占用存储，可在「设置」中导出备份后清理数据。", "err");
      }
      return false;
    }
  }
}

function mergeState(raw){
  const base = defaultState();
  if (!raw || typeof raw !== "object") return base;
  const next = {
    version: DATA_VERSION,
    settings: Object.assign(base.settings, raw.settings || {}),
    wordStats: (raw.wordStats && typeof raw.wordStats === "object") ? raw.wordStats : {},
    grammarStats: (raw.grammarStats && typeof raw.grammarStats === "object") ? raw.grammarStats : {},
    records: (raw.records && typeof raw.records === "object") ? raw.records : {},
    mistakes: Array.isArray(raw.mistakes) ? raw.mistakes : [],
    customWords: Array.isArray(raw.customWords) ? raw.customWords : [],
    meta: Object.assign(base.meta, raw.meta || {})
  };
  if (String(next.settings.examType) !== "6") next.settings.examType = "4";
  if (!["light","dark"].includes(next.settings.theme)) next.settings.theme = "light";
  ["dailyNew","dailyReviewLimit","dailyGrammar","dailyQuiz"].forEach(function(k){
    const n = parseInt(next.settings[k], 10);
    next.settings[k] = (isNaN(n) || n < 1) ? base.settings[k] : Math.min(n, 200);
  });
  return next;
}

function loadState(){

/* 3.5 词库/语法数据运行时展开
   词库规模可能很大（13000+ 条），因此：
   · BANK.activeWords 保存"当前实际使用的词库"，WORDS 始终指向同一个数组引用，
     加载大词库时用 splice 原地替换内容，避免其它模块持有旧引用。
   · INDEX 是学习进度的索引与计数缓存，使统计类操作从 O(词库总量) 降为 O(已学词数)。 */
const WORDS = WORD_ROWS.map(toWordObject);
const WORD_MAP = {};
WORDS.forEach(function(w){ WORD_MAP[w.id] = w; });
const BANK = {
  activeWords: WORDS,           // 当前词库（内置或外部加载）
  source:"builtin",             // builtin | json | js | mixed
  loaded:false,
  promise:null,                 // 进行中的加载 Promise（并发调用复用）
  dir:WORD_DATA_DIR,
  files:[],                     // [{ level, count, via }]
  errors:[],
  loading:false,
  loadedAt:0
};
const INDEX = {
  learned:[],                   // 已学（status !== "new"）的词条引用
  favoriteCount:0,
  wrongCount:0,
  counts:{ total:0, learned:0, learning:0, mastered:0, notStarted:0 }
};
/* 判断某个词是否已开始学习（不创建进度条目，避免污染 localStorage） */
function isLearned(id){
  const s = ST.wordStats[id];
  return !!(s && s.status && s.status !== "new");
}
/* 重建进度索引与计数缓存 */
function rebuildIndex(){
  const learnedArr = [];
  let learning = 0, mastered = 0;
  for (const id in ST.wordStats){
    const s = ST.wordStats[id];
    if (!s || s.status === "new") continue;
    if (!WORD_MAP[id]) continue;              // 词库中被移除的词条不计入
    const w = WORD_MAP[id];
    learnedArr.push(w);
    if (s.status === "mastered") mastered++; else learning++;
  }
  INDEX.learned = learnedArr;
  INDEX.favoriteCount = learnedArr.filter(function(w){ return ST.wordStats[w.id].favorite; }).length;
  INDEX.wrongCount = learnedArr.filter(function(w){ return (ST.wordStats[w.id].wrongCount || 0) > 0; }).length;
  INDEX.counts = {
    total:WORDS.length, learned:learnedArr.length, learning:learning,
    mastered:mastered, notStarted:Math.max(WORDS.length - learnedArr.length, 0)
  };
}
/* 统一设置词库内容：原地替换，保持 WORDS / BANK.activeWords 引用不变。
   注意：允许传入 WORDS 自身（追加词条后重新索引），此时不能先清空再复制，
   否则会把自己清掉——必须先取一份快照。 */
function setWordBank(list){
  const snapshot = (list === WORDS) ? WORDS.slice() : list;
  WORDS.length = 0;
  for (let i = 0; i < snapshot.length; i++) WORDS.push(snapshot[i]);
  for (const k in WORD_MAP) delete WORD_MAP[k];
  WORDS.forEach(function(w){ WORD_MAP[w.id] = w; });
  BANK.activeWords = WORDS;
  BANK.loaded = true;
  BANK.loadedAt = Date.now();
  PAGE_SIZE = WORDS.length > 1000 ? 24 : 12;
  rebuildIndex();
  return WORDS;
}
/* 为用户已学词条预建占位对象：即使某天词库文件没加载出来，
   这部分进度也能在界面上保留（loadWordBank 会把它们并入进度表） */
function ensureLearnedPlaceholders(){
  let added = 0;
  for (const id in ST.wordStats){
    const s = ST.wordStats[id];
    if (!s || s.status === "new" || WORD_MAP[id]) continue;
    const w = {
      id:id, word:s.__word || id, phonetic:"", pos:"—",
      meaningCn:"（该词条暂不在当前词库中，进度已保留）", meaningEn:"",
      example:"", exampleCn:"", synonyms:"", antonyms:"",
      rootAffix:"", collocations:"", level:String(s.__level || ST.settings.examType),
      frequency:3, tags:["历史进度"],
      status:s.status, familiarity:s.familiarity || 0, nextReview:s.nextReview || 0,
      lastReview:s.lastReview || 0, correctCount:s.correctCount || 0,
      wrongCount:s.wrongCount || 0, favorite:!!s.favorite, note:s.note || "",
      createdAt:0, firstLearned:s.firstLearned || "", placeholder:true
    };
    WORDS.push(w);
    WORD_MAP[w.id] = w;
    added++;
  }
  return added;
}
const GRAMMAR_LIST = GRAMMAR_ROWS.map(function(g){
  return {
    id:g.id, title:g.title, category:g.category, level:g.level,
    explanation:g.explanation, rules:g.rules.slice(), examples:g.examples.slice(),

    exercises:g.exercises.map(function(e,i){ return { id:g.id + "-e" + i, q:e.q, options:e.options.slice(), answer:e.answer, analysis:e.analysis }; })
  };
});
const GRAMMAR_MAP = {};
GRAMMAR_LIST.forEach(function(g){ GRAMMAR_MAP[g.id] = g; });

/* --------------------------------------------------------------------------
   3.5b 外部大词库加载（fetch JSON / script 全局变量 / 内置回退）
   目标：把 data/words-cet4.json(7508) + data/words-cet6.json(5651) 合并进 WORDS，
        且**绝不把词库本体写进 localStorage**，localStorage 只保存学习进度。
   -------------------------------------------------------------------------- */
/* 中文/文字考频 → 数字 1-5（内置词库用数字，外部词库常用中文） */
function normalizeFrequency(v){
  if (typeof v === "number" && isFinite(v)) return clamp(Math.round(v), 1, 5);
  const s = String(v === undefined || v === null ? "" : v).trim();
  const num = parseInt(s, 10);
  if (!isNaN(num) && num >= 1 && num <= 5) return num;
  if (/极高|超高频|最常考|核心/.test(s)) return 5;
  if (/高频|常考|重点/.test(s)) return 4;
  if (/普通|一般|中等|常见/.test(s)) return 3;
  if (/低频|较少|偶考/.test(s)) return 2;
  if (/生僻|极低|罕见/.test(s)) return 1;
  return 3;
}
/* 等级 → "4" / "6" */
function normalizeLevel(v){
  const s = String(v === undefined || v === null ? "" : v).toUpperCase();
  if (/6|SIX|CET-?6/.test(s)) return "6";
  return "4";
}
/* 数组/字符串统一为可读字符串（外部词库的 synonyms 等是数组） */
function normalizeText(v, sep){
  if (v === undefined || v === null || v === "") return "";
  if (Array.isArray(v)) return v.filter(Boolean).join(sep || "，");
  if (typeof v === "object") return Object.values(v).filter(Boolean).join(sep || "，");
  return String(v);
}
/* 生成检索用的小写串（只做一次，避免每次搜索都重复拼接） */
function buildHaystack(w){
  return [w.word, w.meaningCn, w.meaningEn, w.example, w.exampleCn,
    w.synonyms, w.antonyms, w.rootAffix, w.collocations, w.pos,
    (w.tags || []).join(" ")].join(" ").toLowerCase();
}
/* 外部原始词条 → 应用内部词条对象（幂等：已归一化过的条目原样返回） */
function normalizeExternalWord(raw, fallbackLevel){
  if (!raw || typeof raw !== "object") return null;
  if (raw.__normalized && raw.id && raw.meaningCn !== undefined) {
    if (!raw.hay) raw.hay = buildHaystack(raw);
    return raw;
  }
  const word = String(raw.word || raw.name || raw.headWord || "").trim();
  const meaningCn = normalizeText(raw.meaningCn || raw.meaning || raw.translation || raw.cn, "；");
  if (!word || !meaningCn) return null;
  const level = normalizeLevel(raw.level || raw.tag || fallbackLevel);
  const w = {
    id: String(raw.id || (("ext-" + level + "-") + word.toLowerCase())),
    word: word,
    phonetic: normalizeText(raw.phonetic || raw.ukphone || raw.usphone, ""),
    pos: normalizeText(raw.pos || raw.partOfSpeech, "/"),
    meaningCn: meaningCn,
    meaningEn: normalizeText(raw.meaningEn || raw.definition || raw.en, " "),
    example: normalizeText(raw.example || raw.sentence, " "),
    exampleCn: normalizeText(raw.exampleCn || raw.sentenceCn, " "),
    synonyms: normalizeText(raw.synonyms || raw.syn, "，"),
    antonyms: normalizeText(raw.antonyms || raw.ant, "，"),
    rootAffix: normalizeText(raw.rootAffix || raw.root || raw.affix, "，"),
    collocations: normalizeText(raw.collocations || raw.phrases || raw.collocation, "；"),
    level: level,
    frequency: (function(){
      const f = normalizeFrequency(raw.frequency || raw.freq || raw.rank);
      /* 若词库用标签标注了高频/常考，则据此提升考频，避免 frequency 全是"普通"时筛选失效 */
      const tagText = Array.isArray(raw.tags) ? raw.tags.join(" ") : String(raw.tags || "");
      if (f <= 3 && /高频|常考|核心|重点|必考/.test(tagText)) return 4;
      return f;
    })(),
    tags: Array.isArray(raw.tags) ? raw.tags.map(String) : (raw.tags ? String(raw.tags).split(/[,，、|]/).filter(Boolean) : []),
    status:"new", familiarity:0, nextReview:0, lastReview:0,
    correctCount:0, wrongCount:0, favorite:false, note:raw.note || "",
    createdAt:0, firstLearned:"", ext:true
  };
  w.__normalized = true;
  w.hay = buildHaystack(w);
  return w;
}
/* 从任意 JSON 结构里取出词条数组 */
function extractWordArray(data){
  if (Array.isArray(data)) return data;
  if (!data || typeof data !== "object") return [];
  const keys = ["words", "data", "list", "items", "result", "entries"];
  for (let i = 0; i < keys.length; i++){
    if (Array.isArray(data[keys[i]])) return data[keys[i]];
  }
  for (const k in data){
    if (Array.isArray(data[k]) && data[k].length && typeof data[k][0] === "object") return data[k];
  }
  return [];
}
/* 读取已通过 script 标签加载好的全局变量 */
function preloadedWordData(key){
  if (typeof window === "undefined") return null;
  const names = (WORD_FILES.find(function(f){ return f.key === key; }) || {}).globals || [];
  for (let i = 0; i < names.length; i++){
    const v = window[names[i]];
    if (Array.isArray(v) && v.length) return v;
    if (v && typeof v === "object") return v;
  }
  return null;
}
function wordDataIsMissing(key){
  if (typeof window === "undefined") return false;
  return key === "4" ? window.__cetJs4Failed === true : window.__cetJs6Failed === true;
}
/* 加载单个词库文件 */
async function loadWordDataFile(cfg){
  /* ① script 全局变量（file:// 也能工作，首选） */
  const pre = preloadedWordData(cfg.key);
  if (pre) return { data:pre, via:"script" };
  if (wordDataIsMissing(cfg.key)) throw new Error("data/" + cfg.file + ".js 加载失败或内容为空");
  /* ② fetch JSON（需要 http:// 环境） */
  const urls = [
    WORD_DATA_DIR + cfg.file + ".json",
    "./" + WORD_DATA_DIR + cfg.file + ".json",
    "/" + WORD_DATA_DIR + cfg.file + ".json"
  ];
  let lastErr = null;
  for (let i = 0; i < urls.length; i++){
    try{
      const res = await fetch(urls[i], { cache:"no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
      return { data:await res.json(), via:"fetch" };
    }catch(err){ lastErr = err; }
  }
  throw new Error((lastErr && lastErr.message) || "未知错误");
}
/* 主加载流程：合并两个文件 → 归一化 → 去重 → 原地替换词库 → 迁移旧进度 → 重建索引 */
async function loadWordBank(){
  /* 已有加载在进行中：复用同一个 Promise，避免并发调用直接返回未完成的结果 */
  if (BANK.loading && BANK.promise) return BANK.promise;
  BANK.promise = doLoadWordBank();
  try{
    return await BANK.promise;
  }finally{
    BANK.promise = null;
  }
}
async function doLoadWordBank(){
  BANK.loading = true;
  BANK.errors = [];
  BANK.files = [];
  const startedAt = Date.now();
  const results = await Promise.all(WORD_FILES.map(async function(cfg){
    try{
      const r = await loadWordDataFile(cfg);
      const rows = extractWordArray(r.data);
      if (!rows.length) throw new Error("文件中没有可识别的词条数组");
      return { cfg:cfg, rows:rows, via:r.via, error:null };
    }catch(err){
      return { cfg:cfg, rows:null, via:null, error:err };
    }
  }));

  /* 归一化 + 合并。
     注意：用户的词库中同一个单词可能出现多次（同形异义/不同义项），
     这类条目**必须保留为独立词条**，否则会丢失释义；
     只有"同等级 + 同单词 + 同释义"的完全重复项才丢弃。 */
  const merged = [];
  const seenId = {};
  const seenExact = {};      // level|word|meaningCn → 已存在
  const homographCount = {}; // level|word → 出现次数，用于标注"同形词"
  let skipped = 0;
  results.forEach(function(r){
    if (!r.rows){ BANK.errors.push({ level:r.cfg.level, message:r.error.message }); return; }
    let accepted = 0;
    for (let i = 0; i < r.rows.length; i++){
      const w = normalizeExternalWord(r.rows[i], r.cfg.level);
      if (!w){ skipped++; continue; }
      const exactKey = w.level + "|" + w.word.toLowerCase() + "|" + w.meaningCn;
      if (seenExact[exactKey] === undefined){
        seenExact[exactKey] = 1;
      } else {
        /* 完全重复：优先保留信息更全的一条 */
        seenExact[exactKey]++;
        skipped++;
        continue;
      }
      if (seenId[w.id] !== undefined) w.id = w.id + "-" + i;
      seenId[w.id] = true;
      merged.push(w);
      accepted++;
    }
    BANK.files.push({ level:r.cfg.level, count:accepted, total:r.rows.length, via:r.via });
  });
  /* 标注同形异义词，便于用户理解"同一个单词出现两次" */
  merged.forEach(function(w){
    const k = w.level + "|" + w.word.toLowerCase();
    homographCount[k] = (homographCount[k] || 0) + 1;
  });
  const variantSeq = {};
  merged.forEach(function(w){
    const k = w.level + "|" + w.word.toLowerCase();
    if (homographCount[k] > 1){
      variantSeq[k] = (variantSeq[k] || 0) + 1;
      if (w.tags.indexOf("同形词") < 0) w.tags.push("同形词");
      w.meaningCn = "【义项 " + variantSeq[k] + "】" + w.meaningCn;
      w.hay = buildHaystack(w);
    }
  });

  if (!merged.length){
    BANK.loading = false;
    const msg = BANK.errors.length ? BANK.errors.map(function(e){ return e.message; }).join("；") : "未读取到任何词条";
    const err = new Error(msg);
    err.isBankError = true;
    throw err;
  }

  /* 重定向用户既有学习进度：旧 id → 新 id（按单词文本匹配），并保留未被覆盖的条目 */
  const idMap = {};
  merged.forEach(function(w){
    const key = w.level + "|" + w.word.toLowerCase();
    idMap["__w__" + key] = w.id;
  });
  const nextStats = {};
  for (const oldId in ST.wordStats){
    const s = ST.wordStats[oldId];
    if (!s) continue;
    const w = WORD_MAP[oldId];
    let newId = oldId;
    if (!w || !merged.some(function(m){ return m.id === oldId; })){
      /* 旧 id 在新词库中不存在：尝试用单词文本重新定位 */
      const txt = (w && w.word) || s.__word;
      const lv = String((w && w.level) || s.__level || ST.settings.examType);
      if (txt){
        const hit = idMap["__w__" + lv + "|" + String(txt).toLowerCase()];
        if (hit) newId = hit;
      }
    }
    if (nextStats[newId]) continue;
    const keep = Object.assign({}, s);
    if (s.__word) keep.__word = s.__word;
    if (s.__level) keep.__level = s.__level;
    nextStats[newId] = keep;
  }
  ST.wordStats = nextStats;

  setWordBank(merged);

  /* 把之前导入过、现已存进 localStorage 的自定义词条重新挂回词库 */
  const customs = Array.isArray(ST.customWords) ? ST.customWords.slice() : [];
  const customIds = {};
  customs.forEach(function(c){ customIds[c.id] = true; });
  /* 清理自定义词条在进度表里的占位（避免出现无对应词条的孤立进度） */
  for (const id in ST.wordStats){
    if (customIds[id] && !WORD_MAP[id]) delete ST.wordStats[id];
  }
  if (customs.length){
    WORDS.push.apply(WORDS, customs);
    customs.forEach(function(c){ WORD_MAP[c.id] = c; });
    setWordBank(WORDS);
  }
  const placeholders = ensureLearnedPlaceholders();
  /* 占位词条是直接 push 进 WORDS 的，必须再重建一次索引，
     否则这些历史进度不会进入"已学/待复习"，用户会以为进度丢了 */
  setWordBank(WORDS);

  BANK.source = BANK.files.length === 2 ? "json" : "mixed";
  BANK.loading = false;
  saveState({ silent:true });
  console.info("[CET] 词库加载完成：" + WORDS.length + " 条，用时 " + (Date.now() - startedAt) + " ms，" +
    "来源 " + BANK.files.map(function(f){ return "CET-" + f.level + " " + f.count + "(" + f.via + ")"; }).join(" + ") +
    (skipped ? "，去重/跳过 " + skipped : "") + (placeholders ? "，历史进度占位 " + placeholders : ""));
  return BANK;
}

function wordBankStatusHTML(){

/* 3.6 单词学习状态读写 ------------------------------------------------ */
/* 在进度里记下单词文本与等级：万一某次启动没能加载到外部词库，
   该词的进度仍能以占位词条形式展示，不会"凭空消失" */
function rememberWord(id){
  const w = WORD_MAP[id];
  const s = ST.wordStats[id];
  if (!w || !s) return;
  if (s.__word !== w.word) s.__word = w.word;
  if (s.__level !== w.level) s.__level = w.level;
}
function wsOf(id){
  if (!ST.wordStats[id]){
    ST.wordStats[id] = {
      status:"new", familiarity:0, nextReview:0, lastReview:0,
      correctCount:0, wrongCount:0, favorite:false, note:"", firstLearned:""
    };
  }
  const s = ST.wordStats[id];
  const w = WORD_MAP[id];
  if (w && (!s.__word || !s.__level)){ s.__word = w.word; s.__level = w.level; }
  return s;
}
function statusLabel(status){
  return status === "mastered" ? "已掌握" : status === "learning" ? "学习中" : "未学";
}
function dueWords(ts){
  const now = ts === undefined ? Date.now() : ts;
  /* 只扫描已产生学习进度的词条，大词库下也不会卡顿 */
  return INDEX.learned.filter(function(w){
    const s = ST.wordStats[w.id];
    return !!s && s.nextReview > 0 && s.nextReview <= now;
  });
}
function unlearnedWords(level){
  const lv = level || ST.settings.examType;
  return WORDS.filter(function(w){
    return w.level === lv && !isLearned(w.id);
  });
}
function isFavoriteWord(id){
  const s = ST.wordStats[id];
  return !!(s && s.favorite);
}
function masteredWords(){ return INDEX.learned.filter(function(w){ return ST.wordStats[w.id].status === "mastered"; }); }
function learningWords(){ return INDEX.learned.filter(function(w){ return ST.wordStats[w.id].status === "learning"; }); }
function wordStatsSummary(){
  return {
    total:WORDS.length,
    learned:INDEX.counts.learned,
    learning:INDEX.counts.learning,
    mastered:INDEX.counts.mastered,
    notStarted:INDEX.counts.notStarted
  };
}

/* 3.7 间隔重复核心算法 ------------------------------------------------ */
/* 反馈类型：know(认识) / fuzzy(模糊) / unknown(不认识)
   返回 { intervalDays, familiarity, message } */
function scheduleReview(wordId, feedback, nowTs){
  const now = nowTs || Date.now();
  const s = wsOf(wordId);
  let intervalDays;

  if (feedback === "know"){
    s.familiarity = Math.min(5, (s.familiarity || 0) + 1);
    s.correctCount = (s.correctCount || 0) + 1;
    intervalDays = INTERVALS[s.familiarity];
  } else if (feedback === "fuzzy"){
    s.wrongCount = (s.wrongCount || 0) + 1;               // 模糊计入"需要加强"
    intervalDays = Math.max(0.5, INTERVALS[s.familiarity || 0] * 0.5);
  } else {
    s.familiarity = 0;                                    // 不认识：重置
    s.wrongCount = (s.wrongCount || 0) + 1;
    intervalDays = 1;                                     // 重置为 1 天后复习
  }

  s.status = s.familiarity >= 5 ? "mastered" : "learning";
  s.lastReview = now;
  s.nextReview = now + intervalDays * DAY_MS;
  if (!s.firstLearned) s.firstLearned = todayStr(now);
  rememberWord(wordId);
  indexAddWord(wordId);
  saveState();
  return { intervalDays:intervalDays, familiarity:s.familiarity, status:s.status, message:intervalText(intervalDays) };
}
/* 进度索引维护：某词从"未学"变为"已学"时把它加入索引，只做常数级开销 */
function indexAddWord(wordId){
  const s = ST.wordStats[wordId];
  const w = WORD_MAP[wordId];
  if (!s || !w || s.status === "new") return;
  if (INDEX.learned.indexOf(w) < 0) INDEX.learned.push(w);
  INDEX.counts.learned = INDEX.learned.length;
  INDEX.counts.notStarted = Math.max(WORDS.length - INDEX.counts.learned, 0);
  /* 只对"已学"集合重算，规模远小于词库总量 */
  let learning = 0, mastered = 0, fav = 0, wrong = 0;
  INDEX.learned.forEach(function(x){
    const st = ST.wordStats[x.id];
    if (!st) return;
    if (st.status === "mastered") mastered++; else learning++;
    if (st.favorite) fav++;
    if ((st.wrongCount || 0) > 0) wrong++;
  });
  INDEX.counts.learning = learning;
  INDEX.counts.mastered = mastered;
  INDEX.favoriteCount = fav;
  INDEX.wrongCount = wrong;
}
function intervalText(days){
  if (days <= 0.5) return "12 小时后";
  if (days < 1) return Math.round(days * 24) + " 小时后";
  return days + " 天后";
}
function markMastered(wordId){
  const s = wsOf(wordId);
  s.status = "mastered";
  s.familiarity = 5;
  s.lastReview = Date.now();
  s.nextReview = Date.now() + INTERVALS[5] * DAY_MS;
  if (!s.firstLearned) s.firstLearned = todayStr();
  rememberWord(wordId);
  rebuildIndex();
  saveState();
}
function toggleFavoriteWord(wordId){
  const s = wsOf(wordId);
  s.favorite = !s.favorite;
  rememberWord(wordId);
  rebuildIndex();
  saveState();
  return s.favorite;
}
/* 手动加入错题本 */
function addWordToMistakes(word){
  const exists = ST.mistakes.some(function(m){ return m.wordId === word.id && m.type === "manual"; });
  if (exists){
    toast("该词已在错题本中", "warn");
    return false;
  }
  ST.mistakes.unshift({
    id:uid(), wordId:word.id, word:word.word, type:"manual",
    prompt:word.word, userAnswer:"（标记为不认识）", correct:word.meaningCn,
    analysis:"来自词汇页手动加入：" + word.word + " " + word.phonetic + " " + word.meaningCn,
    time:Date.now()
  });
  saveState();
  return true;
}

/* 3.8 学习记录 -------------------------------------------------------- */
function todayStr(ts){
  const d = ts ? new Date(ts) : new Date();
  return dateKey(d);
}
function dateKey(d){
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function getRecord(date){
  const key = date || todayStr();
  if (!ST.records[key]){
    ST.records[key] = { date:key, newWords:0, reviewedWords:0, grammarCount:0, quizTotal:0, quizCorrect:0, quizAccuracy:0, duration:0, completed:false };
  }
  return ST.records[key];
}
function recordNewWord(wordId){
  const rec = getRecord();
  rec.newWords++;
  const s = wsOf(wordId);
  if (s.firstLearned !== rec.date) s.firstLearned = rec.date;
  flushDuration();
  saveState();
}
function recordReview(wordId){
  const rec = getRecord();
  rec.reviewedWords++;
  flushDuration();
  saveState();
}
function recordGrammar(){
  const rec = getRecord();
  rec.grammarCount++;
  flushDuration();
  saveState();
}
function recordQuizAnswer(correct){
  const rec = getRecord();
  rec.quizTotal++;
  if (correct) rec.quizCorrect++;
  rec.quizAccuracy = rec.quizTotal > 0 ? Math.round(rec.quizCorrect / rec.quizTotal * 100) : 0;
  flushDuration();
  saveState();
}
/* 用真实停留时间累加学习时长（分钟，保留一位小数）；每次学习操作与切换页面都会调用 */
let pageEnterTs = Date.now();
function flushDuration(){
  const now = Date.now();
  const addMin = (now - pageEnterTs) / 60000;
  pageEnterTs = now;
  if (addMin <= 0 || addMin > 240) return;
  const rec = getRecord();
  rec.duration = Math.round((rec.duration + addMin) * 10) / 10;
  saveState();
}

/* 3.9 打卡与统计 ------------------------------------------------------ */
function isCheckedIn(date){
  const rec = ST.records[date];
  return !!(rec && rec.completed);
}
function checkIn(){
  const rec = getRecord();
  rec.completed = true;
  saveState();
}
function streakDays(){
  let streak = 0;
  const d = new Date();
  // 今天未打卡时，从昨天开始向前计算，避免"今天还没学"导致连续天数归零
  if (!isCheckedIn(dateKey(d))) d.setDate(d.getDate() - 1);
  while (isCheckedIn(dateKey(d))){
    streak++;
    d.setDate(d.getDate() - 1);
    if (streak > 3650) break;
  }
  return streak;
}
function totalStudyDays(){
  return Object.keys(ST.records).filter(function(k){ return (ST.records[k].newWords + ST.records[k].reviewedWords + ST.records[k].grammarCount + ST.records[k].quizTotal) > 0; }).length;
}
function totalLearnedWords(){
  return WORDS.filter(function(w){ const s = ST.wordStats[w.id]; return s && s.status !== "new"; }).length;
}
function overallAccuracy(){
  let c = 0, t = 0;
  Object.keys(ST.records).forEach(function(k){ c += ST.records[k].quizCorrect || 0; t += ST.records[k].quizTotal || 0; });
  return t > 0 ? Math.round(c / t * 100) : 0;
}
function totalDuration(){
  let m = 0;
  Object.keys(ST.records).forEach(function(k){ m += ST.records[k].duration || 0; });
  return Math.round(m);
}
/* 最近 n 天的记录数组（从早到晚） */
function recentRecords(n){
  const out = [];
  for (let i = n - 1; i >= 0; i--){
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = dateKey(d);
    const rec = ST.records[key] || { date:key, newWords:0, reviewedWords:0, grammarCount:0, quizTotal:0, quizCorrect:0, quizAccuracy:0, duration:0, completed:false };
    out.push(rec);
  }
  return out;
}

/* 3.10 今日任务清单 --------------------------------------------------- */
function todayTasks(){
  const rec = getRecord();
  const due = dueWords();
  const st = ST.settings;
  const newTarget = st.dailyNew;
  const reviewTarget = Math.min(st.dailyReviewLimit, Math.max(due.length, 0));
  const grammarTarget = st.dailyGrammar;
  const quizTarget = st.dailyQuiz;
  const dueDone = Math.min(rec.reviewedWords, due.length);
  return {
    rec:rec,
    newTarget:newTarget,
    newDone:Math.min(rec.newWords, newTarget),
    reviewTarget:reviewTarget,
    reviewDone:dueDone,
    dueLeft:Math.max(due.length - dueDone, 0),
    grammarTarget:grammarTarget,
    grammarDone:Math.min(rec.grammarCount, grammarTarget),
    quizTarget:quizTarget,
    quizDone:Math.min(rec.quizTotal, quizTarget),
    allDone: rec.newWords >= newTarget && dueDone >= due.length && rec.grammarCount >= grammarTarget && rec.quizTotal >= quizTarget
  };
}

/* 3.11 通用工具函数 --------------------------------------------------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(str){
  if (str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function sample(arr, n){ return shuffle(arr).slice(0, n); }
function byId(id){ return document.getElementById(id); }
function fmtDateCN(key){
  const p = key.split("-");
  return parseInt(p[1],10) + "月" + parseInt(p[2],10) + "日";
}
function fmtTime(ts){
  if (!ts) return "—";
  const d = new Date(ts);
  return (d.getMonth()+1) + "月" + d.getDate() + "日 " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function relTime(ts){
  if (!ts) return "未安排";
  const diff = ts - Date.now();
  if (diff <= 0) return "现在可复习";
  if (diff < HOUR_MS) return Math.max(1, Math.round(diff / 60000)) + " 分钟后";
  if (diff < DAY_MS) return Math.round(diff / HOUR_MS) + " 小时后";
  return Math.round(diff / DAY_MS) + " 天后";
}
function stars(n){
  const full = Math.round(n);
  return "★".repeat(clamp(full,0,5)) + "☆".repeat(clamp(5 - full,0,5));
}
function highlight(text, word){
  const safe = esc(text);
  if (!word) return safe;
  try{
    const re = new RegExp("(" + String(word).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-z]{0,3})", "ig");
    return safe.replace(re, "<mark class='hl'>$1</mark>");
  }catch(e){ return safe; }
}
/* 提示条 */
let toastTimer = null;
function toast(msg, type){
  const box = byId("toasts");
  if (!box) return;
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = msg;

    el.style.transform = "translateY(8px)";
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 260);
  }, type === "err" ? 3400 : 2100);
}
/* 模态框 */
function openModal(opts){
  const root = byId("modalRoot");
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.innerHTML =
    '<div class="modal-box" role="dialog" aria-modal="true">' +
      '<div class="modal-h"><h3>' + esc(opts.title || "") + '</h3>' +
      '<button class="icon-btn" data-close="1" aria-label="关闭">✕</button></div>' +
      '<div class="modal-body">' + (opts.html || "") + '</div>' +
      (opts.footer ? '<div class="modal-f">' + opts.footer + '</div>' : "") +
    '</div>';
  root.appendChild(wrap);
  function close(){ if (wrap.parentNode) wrap.parentNode.removeChild(wrap); if (opts.onClose) opts.onClose(); }
  wrap.addEventListener("click", function(e){
    if (e.target === wrap || e.target.closest("[data-close]")) close();
  });
  document.addEventListener("keydown", function onEsc(e){
    if (e.key === "Escape"){ close(); document.removeEventListener("keydown", onEsc); }
  });
  if (opts.onOpen) opts.onOpen(wrap);
  return wrap;
}

        onOk();
      });
    }
  });
}

/* 3.12 语音朗读（Web Speech API，带不可用降级提示） ------------------- */
const speechSupported = (typeof window !== "undefined") && ("speechSynthesis" in window) && (typeof window.SpeechSynthesisUtterance === "function");
let speechWarned = false;
function speak(text){
  if (!speechSupported){
    if (!speechWarned){
      toast("当前浏览器不支持发音，请使用 Chrome / Edge / Safari 最新版", "warn");
      speechWarned = true;
    }
    return false;
  }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = 0.92;
    u.pitch = 1;
    const voices = window.speechSynthesis.getVoices() || [];
    const en = voices.filter(function(v){ return /en(-|_)?(US|GB|AU)?/i.test(v.lang); });
    const preferred = en.find(function(v){ return /US|United States|Samantha|Google US/i.test(v.name + v.lang); }) || en[0];
    if (preferred) u.voice = preferred;
    window.speechSynthesis.speak(u);
    return true;
  }catch(err){
    console.warn("[CET] 语音合成失败", err);
    if (!speechWarned){ toast("发音播放失败，当前浏览器可能不支持该功能", "warn"); speechWarned = true; }
    return false;
  }
}
function speechHint(){
  return speechSupported ? "" : '<div class="notice"><span>⚠️</span><span>当前浏览器不支持发音（Web Speech API 不可用），发音按钮将不可用。</span></div>';

function goPage(id, opts){
  if (ROUTES.indexOf(id) < 0) id = "dashboard";
  flushDuration();
  clearPageTimers();
  destroyChart();
  currentPage = id;
  if (opts && opts.reset){
    if (id === "words") UI.wordFilter.page = 1;
    if (id === "grammar") UI.grammarDetail = null;
  }
  location.hash = "#/" + id;
  render();
  view.scrollIntoView({ behavior:"smooth", block:"start" });
  window.scrollTo({ top:0, behavior:"smooth" });
}
function clearPageTimers(){
  pageTimers.forEach(function(t){ clearTimeout(t); clearInterval(t); });
  pageTimers = [];
}
function destroyChart(){
  if (chartRef && typeof chartRef.destroy === "function"){
    try{ chartRef.destroy(); }catch(e){ /* 忽略 */ }
  }
  chartRef = null;
}
function setView(html){
  view.innerHTML = html;
}

/* 4.5 图表：Chart.js 优先，失败降级纯 CSS ------------------------------ */
function drawTrendChart(canvasId, recs, type){
  const canvas = byId(canvasId);
  if (!canvas) return;
  const labels = recs.map(function(r){ const p = r.date.split("-"); return parseInt(p[1],10) + "/" + parseInt(p[2],10); });
  const newData = recs.map(function(r){ return r.newWords || 0; });
  const revData = recs.map(function(r){ return r.reviewedWords || 0; });
  const hasData = newData.some(Boolean) || revData.some(Boolean);
  if (!hasData){
    canvas.parentNode.innerHTML = '<div class="empty" style="padding:26px 10px"><span class="em-ico">📉</span><h4>暂无学习数据</h4><p>完成一次背单词或复习后，这里会显示趋势图。</p></div>';
    return;
  }
  if (window.Chart){
    try{
      const css = getComputedStyle(document.documentElement);
      const primary = css.getPropertyValue("--primary").trim() || "#5b6cff";
      const accent = css.getPropertyValue("--accent").trim() || "#14b8a6";
      const text3 = css.getPropertyValue("--text3").trim() || "#8b93ab";
      const border = css.getPropertyValue("--border").trim() || "#e5e8f2";
      const ctx = canvas.getContext("2d");
      chartRef = new window.Chart(ctx, {
        type:"bar",
        data:{
          labels:labels,
          datasets:[
            { label:"新学词数", data:newData, backgroundColor:primary, borderRadius:6, maxBarThickness:26 },
            { label:"复习词数", data:revData, backgroundColor:accent, borderRadius:6, maxBarThickness:26 }
          ]
        },
        options:{
          responsive:true, maintainAspectRatio:false,
          animation:{ duration:450 },
          plugins:{
            legend:{ labels:{ color:text3, boxWidth:12, usePointStyle:true, font:{ size:11.5 } } },
            tooltip:{ backgroundColor:"rgba(20,26,60,.92)", padding:10, cornerRadius:8 }
          },
          scales:{
            x:{ grid:{ display:false }, ticks:{ color:text3, font:{ size:11 } } },
            y:{ beginAtZero:true, grid:{ color:border }, ticks:{ color:text3, font:{ size:11 }, precision:0 } }
          }
        }
      });
      return;
    }catch(err){
      console.warn("[CET] Chart.js 渲染失败，降级为内置图表", err);
    }
  }
  // 降级：纯 CSS 柱状图
  const max = Math.max.apply(null, newData.concat(revData).concat([1]));
  const note = byId("chartNote");
  if (note) note.textContent = "图表库未加载，已使用内置图表";
  canvas.parentNode.innerHTML = '<div class="fallback-chart">' + recs.map(function(r, i){
    return '<div class="fb-col" title="' + r.date + ' 新学 ' + newData[i] + " / 复习 " + revData[i] + '">' +
      '<div style="display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center">' +
        '<div class="fb-bar" style="height:' + Math.max(3, newData[i] / max * 100) + '%"></div>' +
        '<div class="fb-bar b2" style="height:' + Math.max(3, revData[i] / max * 100) + '%"></div>' +
      '</div>' +
      '<span class="fb-lbl">' + labels[i] + '</span></div>';
  }).join("") + '</div>';
}

function countByLevel(lv){
  let n = 0;
  for (let i = 0; i < WORDS.length; i++){ if (WORDS[i].level === lv) n++; }
  return n;
}

function option(value, label, current){
  return '<option value="' + esc(value) + '"' + (String(current) === String(value) ? " selected" : "") + '>' + esc(label) + '</option>';
}
function chip(kind, value, label, current){
  return '<button class="chip' + (String(current) === String(value) ? " active" : "") + '" data-chip="' + kind + '" data-value="' + esc(value) + '">' + esc(label) + '</button>';
}

function filterWords(){
  const f = UI.wordFilter;
  const kw = f.keyword.trim().toLowerCase();
  /* 大词库（1 万+）下"全部/未学"这类宽范围筛选没必要逐个扫描，直接返回词库本身 */
  const wideScope = (f.scope === "all" || f.scope === "new") && !kw && f.tag === "all";
  if (wideScope && f.level === "all" && f.sort === "default") return WORDS.slice();
  let list = WORDS.filter(function(w){
    if (f.level !== "all" && w.level !== f.level) return false;
    if (f.tag !== "all" && (w.tags || []).indexOf(f.tag) < 0) return false;
    if (f.scope !== "all" && f.scope !== "new"){
      const s = ST.wordStats[w.id];
      const status = s ? s.status : "new";
      if (f.scope === "high" && w.frequency < 4) return false;
      if (f.scope === "learned" && status === "new") return false;
      if (f.scope === "favorite" && !(s && s.favorite)) return false;
      if (f.scope === "wrong" && !(s && (s.wrongCount > 0 || (s.status !== "new" && s.familiarity <= 1)))) return false;
      if (f.scope === "mastered" && status !== "mastered") return false;
      if (f.scope === "due" && !(s && s.nextReview > 0 && s.nextReview <= Date.now())) return false;
    }
    if (f.scope === "new" && isLearned(w.id)) return false;
    if (f.scope === "high" && w.frequency < 4) return false;
    if (kw){
      /* 检索串在加载/新建词条时已预生成，避免每次搜索重复拼接 1 万多次 */
      const hay = w.hay || (w.hay = buildHaystack(w));
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
  if (f.sort === "alpha") list.sort(function(a,b){ return a.word.localeCompare(b.word); });
  else if (f.sort === "freq") list.sort(function(a,b){ return b.frequency - a.frequency; });
  else if (f.sort === "wrong") list.sort(function(a,b){ const x = ST.wordStats[a.id], y = ST.wordStats[b.id]; return ((y&&y.wrongCount)||0) - ((x&&x.wrongCount)||0); });
  else if (f.sort === "due") list.sort(function(a,b){ const x = ST.wordStats[a.id], y = ST.wordStats[b.id]; return ((x&&x.nextReview)||0) - ((y&&y.nextReview)||0); });
  return list;
}

function bindWordPageEvents(){
  const search = byId("wordSearch");

    search.addEventListener("input", function(){
      clearTimeout(timer);
      timer = setTimeout(function(){
        UI.wordFilter.keyword = search.value;
        UI.wordFilter.page = 1;
        UI.cardIndex = 0;
        render();
        const el = byId("wordSearch");
        if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      }, 260);
      pageTimers.push(timer);    });

  if (sort) sort.addEventListener("change", function(){ UI.wordFilter.sort = sort.value; UI.wordFilter.page = 1; render(); });
  const modeBtn = byId("wordModeBtn");
  if (modeBtn) modeBtn.addEventListener("click", function(){
    UI.wordMode = UI.wordMode === "card" ? "list" : "card";

/* 会话操作 ---------------------------------------------------------- */
function buildReviewQueue(){
  const due = dueWords().sort(function(a,b){ return (wsOf(a.id).nextReview || 0) - (wsOf(b.id).nextReview || 0); });
  const limit = Math.min(due.length, ST.settings.dailyReviewLimit);
  return due.slice(0, limit).map(function(w){ return { id:w.id, kind:"review" }; });
}
function buildNewQueue(){
  const tasks = todayTasks();
  const left = Math.max(tasks.newTarget - tasks.newDone, 0) || tasks.newTarget;
  const pool = unlearnedWords();
  return pool.slice(0, Math.max(1, left)).map(function(w){ return { id:w.id, kind:"new" }; });
}
function startReviewSession(ignoreLimit){
  let q = ignoreLimit
    ? dueWords().map(function(w){ return { id:w.id, kind:"review" }; })
    : buildReviewQueue();
  if (!q.length){ toast("当前没有到期的复习单词", "warn"); return; }
  if (UI.reviewMode === "random") q = shuffle(q);
  startSession({ title:"复习到期单词（" + q.length + " 词）", queue:q, mode:UI.reviewMode === "order" ? "order" : "flash", origin:"review" });
}
function startNewSession(){
  let q = buildNewQueue();
  if (!q.length){ toast("当前等级的词库已全部学过，可切换到其他等级", "warn"); return; }
  if (UI.reviewMode === "random") q = shuffle(q);
  startSession({ title:"背诵新词（" + q.length + " 词）", queue:q, mode:"flash", origin:"review" });
}
function startMixedSession(){
  let q = buildReviewQueue().concat(buildNewQueue());
  if (!q.length){ toast("暂无可学习的单词，请先调整每日目标或词库等级", "warn"); return; }
  if (UI.reviewMode === "random") q = shuffle(q);
  startSession({ title:"混合学习（新词 + 复习，共 " + q.length + " 词）", queue:q, mode:UI.reviewMode === "order" ? "order" : "flash", origin:"review" });
}
function sessionFeedback(feedback){
  const ses = UI.studySession;
  if (!ses) return;
  const item = ses.queue[ses.index];
  if (!item) return;
  const w = WORD_MAP[item.id];
  const wasNew = item.kind === "new" || wsOf(w.id).status === "new";
  const res = scheduleReview(w.id, feedback);
  ses.fed += (feedback === "know" ? 1 : 0);
  ses.total++;
  if (wasNew){
    if (item.kind === "new") recordNewWord(w.id);
    ses.newCount++;
  } else {
    recordReview(w.id);
    ses.reviewCount++;
  }
  let toasted = false;
  if (feedback === "unknown"){
    addMistakeFromWord(w, "不认识");
    toast("已加入错题本：" + w.word + "，1 天后重新复习", "warn");
    toasted = true;
  }
  if (res.status === "mastered" && !toasted){
    toast("🏆 " + w.word + " 已掌握，下次复习 " + res.message, "ok");
    toasted = true;
  }
  if (!toasted){
    toast(w.word + " → " + res.message + "（熟悉度 " + res.familiarity + "）", feedback === "know" ? "ok" : "");
  }
  ses.index++;
  ses.revealed = false;
  if (ses.index >= ses.queue.length){
    ses.finished = true;
    flushDuration();
  }
  render();
}
function addMistakeFromWord(w, source){
  const dup = ST.mistakes.some(function(m){ return m.wordId === w.id && m.type === "study" && (Date.now() - m.time) < 12 * HOUR_MS; });
  if (dup) return;
  ST.mistakes.unshift({
    id:uid(), wordId:w.id, word:w.word, type:"study",
    prompt:"【" + source + "】" + w.word + " " + w.phonetic,
    userAnswer:"不认识 / 记忆模糊",
    correct:w.meaningCn,
    analysis:"中文释义：" + w.meaningCn + "；英文释义：" + w.meaningEn + "；例句：" + w.example + "（" + w.exampleCn + "）",
    time:Date.now()
  });
  saveState();
}

let keyboardBound = false;
function bindKeyboardShortcuts(){
  if (keyboardBound) return;
  keyboardBound = true;
  document.addEventListener("keydown", function(e){
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    if (currentPage !== "review") return;
    const ses = UI.studySession;
    if (!ses || ses.finished) return;
    if (e.code === "Space"){ e.preventDefault(); if (ses.mode !== "order"){ ses.revealed = !ses.revealed; render(); } return; }
    if (!ses.revealed && ses.mode !== "order") return;
    if (e.key === "1"){ sessionFeedback("know"); }
    else if (e.key === "2"){ sessionFeedback("fuzzy"); }
    else if (e.key === "3"){ sessionFeedback("unknown"); }
  });
}
